# Yerel geliştirme altyapısı. Kullanım: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: omvila
      POSTGRES_USER: omvila_migrator
      POSTGRES_PASSWORD: dev_only_password
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/init:/docker-entrypoint-initdb.d:ro # omvila_app rolü (RLS'e tabi, sahip değil) ve btree_gist; Dilim 1'de eklenir
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omvila_migrator -d omvila']
      interval: 5s
      retries: 10

  prism:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 -p 4010 /contracts/openapi.yaml
    ports: ['4010:4010']
    volumes:
      - ./contracts:/contracts:ro

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

volumes:
  pgdata:
