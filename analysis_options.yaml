# Ortak Dart analiz ayarı. Kurallar: docs/standartlar/kodlama-flutter.md
# Üye paketler kendi analysis_options.yaml dosyasını eklemezse bu dosya geçerlidir.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Uyarı = hata
    todo: ignore
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'packages/api-client-dart/**'
