# Dart pub workspace kökü ve Melos betikleri (ADR-0010).
# Paketler oluştukça `workspace:` listesine eklenir; her üye pubspec'inde `resolution: workspace` bulunur.
name: omvila_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/omvila_ui
  - packages/api-client-dart
  - mobile/isletme
  - mobile/musteri

dev_dependencies:
  melos: ^7.0.0
  very_good_analysis: ^9.0.0

melos:
  name: omvila
  sdkPath: .fvm/flutter_sdk
  scripts:
    # --no-pub: bağımlılıklar kökte bir kez çözülür (dart pub get); flutter komutları paralel çalışırken
    # her biri workspace'i yeniden çözmeye kalkıp başlangıç kilidinde çakışmasın.
    # Üretilmiş API istemcisi (omvila_api) biçim ve analiz dışındadır; derlenmesini contracts.yml denetler.
    analyze:
      description: Statik analiz, bilgi düzeyi dahil hata (docs/standartlar/kodlama-flutter.md)
      exec: flutter analyze --fatal-infos --no-pub
      packageFilters:
        ignore: omvila_api
    format:check:
      description: Biçim denetimi
      exec: dart format --set-exit-if-changed .
      packageFilters:
        ignore: omvila_api
    test:
      description: Testler (test klasörü olan paketler)
      exec: flutter test --no-pub
      packageFilters:
        dirExists: test
    # Uçtan uca akışlar (integration_test/) Prism mock'a karşı; önce `pnpm --filter @omvila/contracts mock`.
    # Cihaz/emülatör gerekmez: flutter_tester'da (başsız) çalışır. `-d flutter-tester` verilmezse araç cihaz arar
    # (`--show-test-device` bu gizli aygıtı görünür yapar). Prism yalnız IPv4 dinler; adres 127.0.0.1 (başka adres: PRISM_URL).
    integration:
      description: Uçtan uca akışlar (Prism mock, flutter_tester)
      run: flutter --show-test-device test integration_test --no-pub -d flutter-tester --dart-define=API_URL=${PRISM_URL:-http://127.0.0.1:4010}
      exec:
        concurrency: 1
      packageFilters:
        dirExists: integration_test
