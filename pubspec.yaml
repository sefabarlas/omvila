# Dart pub workspace kökü ve Melos betikleri (ADR-0010).
# Paketler oluştukça `workspace:` listesine eklenir; her üye pubspec'inde `resolution: workspace` bulunur.
name: omvila_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/omvila_ui
  - packages/api-client-dart
  # - mobile/isletme
  # - mobile/musteri

dev_dependencies:
  melos: ^7.0.0
  very_good_analysis: ^9.0.0

melos:
  name: omvila
  sdkPath: .fvm/flutter_sdk
  scripts:
    # Üretilmiş API istemcisi (omvila_api) biçim ve analiz dışındadır; derlenmesini contracts.yml denetler.
    analyze:
      description: Statik analiz, bilgi düzeyi dahil hata (docs/standartlar/kodlama-flutter.md)
      exec: flutter analyze --fatal-infos
      packageFilters:
        ignore: omvila_api
    format:check:
      description: Biçim denetimi
      exec: dart format --set-exit-if-changed .
      packageFilters:
        ignore: omvila_api
    test:
      description: Testler (test klasörü olan paketler)
      exec: flutter test
      packageFilters:
        dirExists: test
