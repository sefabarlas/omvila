      responses:
        '200':
          description: Günün kasası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashDay'
              example:
                branchId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5a01
                date: '2026-11-25'
                timeZone: Europe/Istanbul
                status: Open
                total: { amount: { amountMinor: 1044000, currency: TRY }, count: 14 }
                cash: { amount: { amountMinor: 345000, currency: TRY }, count: 6 }
                card: { amount: { amountMinor: 589000, currency: TRY }, count: 5 }
                transfer:
                  amount: { amountMinor: 110000, currency: TRY }
