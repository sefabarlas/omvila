        awaitingReplyCount: { type: integer, description: '"Yanıt bekleyen"', example: 2 }
        thisMonthCount: { type: integer, description: '"Bu ay"', example: 31 }
        thisMonthInviteResponsePercent: { type: [number, 'null'], description: '"davet edilenlerin %38''i"; bu ay davet yoksa null', example: 38 }
        topStaff:
          description: '"En çok övülen" (son 90 gün, en az ReviewPublicThreshold değerlendirme alan personel arasında en yüksek ortalama); yoksa null'
          oneOf:
            - type: 'null'
            - type: object
              required: [staffId, fullName, averageRating, count]
              properties:
                staffId: { type: string, format: uuid }
                fullName: { type: string, example: Elif Kaya }
                averageRating: { type: number, example: 4.9 }
                count: { type: integer, example: 96 }
    ReviewPage:
      type: object
      required: [items, nextCursor, overview]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewView' }
        nextCursor: { type: [string, 'null'] }
        overview: { $ref: '#/components/schemas/ReviewOverview' }
    ReviewReplyRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 2, maxLength: 1000, description: '"Yanıtınızı yazın, müşteri görür"' }
    CustomerReviewPage:
      type: object
      description: Müşteri kartı Değerlendirmeler sekmesi
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewView' }
        nextCursor: { type: [string, 'null'] }
    PublicReviewInvite:
      type: object
      description: Değerlendirme bağlantısı (omvila.com/d/{accessCode}) açılışı ("Kuaför Elif'te nasıldı?")
      required: [brand, branchName, appointmentStartUtc, timeZone, serviceNames, customerDisplayName, alreadyReviewed]
      properties:
        brand:
          type: object
          required: [name, slug]
          properties:
            name: { type: string, example: Kuaför Elif }
            slug: { type: string, example: kuafor-elif }
            logoUrl: { type: [string, 'null'] }
        branchName: { type: string, example: Kadıköy }
        appointmentStartUtc: { type: string, format: date-time }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        serviceNames:
          type: array
          items: { type: string }
          example: [Boya ve fön]
        staff:
          description: '"Sizi bu randevuda ağırlayan kişi"; personelsiz randevuda null'
          oneOf:
            - type: 'null'
            - type: object
              required: [name]
              properties:
                name: { type: string, example: Elif Kaya }
                photoUrl: { type: [string, 'null'] }
        customerDisplayName: { type: string, description: 'Yorumda görünecek ad ("Merve Y."): ad + soyadın baş harfi', example: Merve Y. }
        alreadyReviewed: { type: boolean, description: true ise form yerine gönderilmiş değerlendirme gösterilir }
        review:
          description: Gönderilmiş değerlendirme; yoksa null
          oneOf:
            - type: 'null'
            - type: object
              required: [rating, createdUtc]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5, example: 4 }
                comment: { type: [string, 'null'] }
                createdUtc: { type: string, format: date-time }
    PublicReviewCreate:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5, example: 4 }
        comment: { type: [string, 'null'], maxLength: 1000, description: '"Yorum (isteğe bağlı)"' }

    # ───────── Dilim 5: bekleme listesi ─────────
    WaitlistTimeWindow:
      type: string
      description: '"Hangi saatler size uyar?" Morning = Sabah, Afternoon = Öğleden sonra, Evening = Akşam (aralıklar şubenin yerel saatiyle sunucuda tanımlıdır)'
      enum: [Morning, Afternoon, Evening]
    WaitlistEntryStatus:
      type: string
      description: Waiting = bekliyor; Converted = teklif kabul edildi, randevu oluştu; Cancelled = "Listeden çık"; Expired = istenen günlerin hepsi geçti
      enum: [Waiting, Converted, Cancelled, Expired]
    WaitlistOfferStatus:
      type: string
      description: Pending = teklif gönderildi, saat tutuluyor; Accepted = "Randevuyu al"; Declined = "Bu saat olmaz"; Expired = 15 dk doldu; Withdrawn = salon "Teklifi geri al" dedi
      enum: [Pending, Accepted, Declined, Expired, Withdrawn]
    WaitlistPreferences:
      type: object
      description: Bekleme tercihi. dates boşsa "Herhangi bir gün", timeWindows boşsa her saat uyar
      required: [serviceIds, acceptOtherStaff, dates, timeWindows]
      properties:
        serviceIds:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: uuid }
        preferredStaffId: { type: [string, 'null'], format: uuid, description: null = fark etmez }
        acceptOtherStaff: { type: boolean, description: '"Başka personel de olur"' }
        dates:
          type: array
          maxItems: 14
          description: İstenen yerel günler
          items: { type: string, format: date }
        timeWindows:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/WaitlistTimeWindow' }
    WaitlistOfferView:
      type: object
      required: [id, status, startUtc, endUtc, holdExpiresUtc, offeredUtc]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WaitlistOfferStatus' }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        staffId: { type: [string, 'null'], format: uuid }
        staffName: { type: [string, 'null'], example: Elif Kaya }
        offeredUtc: { type: string, format: date-time }
        holdExpiresUtc: { type: string, format: date-time }
    WaitlistEntryView:
      type: object
      description: Bekleme listesi satırı (BeklemeListesi)
      required: [id, branchId, status, customer, serviceIds, serviceNames, acceptOtherStaff, dates, timeWindows, joinedUtc, source, pendingOffer, version]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WaitlistEntryStatus' }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        serviceIds:
          type: array
          items: { type: string, format: uuid }
        serviceNames:
          type: array
          items: { type: string }
          example: [Fön]
        preferredStaffId: { type: [string, 'null'], format: uuid }
        preferredStaffName: { type: [string, 'null'], description: null ise "Fark etmez", example: Elif Kaya }
        acceptOtherStaff: { type: boolean }
        dates:
          type: array
          items: { type: string, format: date }
        timeWindows:
          type: array
          items: { $ref: '#/components/schemas/WaitlistTimeWindow' }
        note: { type: [string, 'null'] }
        joinedUtc: { type: string, format: date-time, description: '"3 gündür bekliyor"' }
        source: { type: string, enum: [Online, Panel] }
        pendingOffer:
          description: Bekleyen teklif ("Teklif gönderildi"); yoksa null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WaitlistOfferView'
        version: { $ref: '#/components/schemas/Version' }
    WaitlistOverview:
      type: object
      required: [waitingCount, convertedThisMonth, offerHoldMinutes]
      properties:
        waitingCount: { type: integer, description: '"Bekleyen"', example: 4 }
        oldestJoinedUtc: { type: [string, 'null'], format: date-time, description: '"en eskisi 6 gündür"' }
        convertedThisMonth: { type: integer, description: '"Bu ay yerleşen · boşalan saatlerden"', example: 11 }
        offerHoldMinutes: { type: integer, description: '"Teklif süresi" (WaitlistOfferHoldMinutes)', example: 15 }
    WaitlistList:
      type: object
      required: [branchId, timeZone, generatedUtc, items, overview]
      properties:
        branchId: { type: string, format: uuid }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        generatedUtc: { type: string, format: date-time, description: Sunucunun "şimdi"si; kalan teklif süresi buna göre sayılır }
        items:
          type: array
          items: { $ref: '#/components/schemas/WaitlistEntryView' }
        overview: { $ref: '#/components/schemas/WaitlistOverview' }
    ManageWaitlistCreate:
      type: object
      description: '"Listeye ekle" gövdesi'
      required: [branchId, preferences]
      properties:
        branchId: { type: string, format: uuid }
        brandCustomerId: { type: string, format: uuid, description: Var olan müşteri; newCustomer ile XOR }
        newCustomer:
          type: object
          required: [fullName, phone]
          properties:
            fullName: { type: string, minLength: 2, maxLength: 120 }
            phone: { $ref: '#/components/schemas/PhoneInput' }
        preferences: { $ref: '#/components/schemas/WaitlistPreferences' }
        note: { type: [string, 'null'], maxLength: 300 }
    WaitlistOfferRequest:
      type: object
      description: '"Saat öner" gövdesi'
      required: [startUtc, staffId]
      properties:
        startUtc: { type: string, format: date-time }
        staffId: { type: string, format: uuid }
    PublicWaitlistJoin:
      type: object
      description: '"Bekleme listesine katıl" gövdesi (DoluGun, BeklemeKatil); telefon doğrulamasından sonra'
      required: [preferences, fullName, privacyNoticeAcknowledged, privacyNoticeVersion]
      properties:
        preferences: { $ref: '#/components/schemas/WaitlistPreferences' }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        privacyNoticeAcknowledged: { type: boolean, const: true, description: Aydınlatma metni okundu }
        privacyNoticeVersion: { type: string }
    PublicWaitlistEntry:
      type: object
      required: [id, accessCode, status, branchId, timeZone, serviceNames, acceptOtherStaff, dates, timeWindows]
      properties:
        id: { type: string, format: uuid }
        accessCode: { type: string, description: '"Listeden çık" bağlantısının kodu', example: W3nB8xQ2 }
        status: { $ref: '#/components/schemas/WaitlistEntryStatus' }
        branchId: { type: string, format: uuid }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        serviceNames:
          type: array
          items: { type: string }
        preferredStaffName: { type: [string, 'null'] }
        acceptOtherStaff: { type: boolean }
        dates:
          type: array
          items: { type: string, format: date }
        timeWindows:
          type: array
          items: { $ref: '#/components/schemas/WaitlistTimeWindow' }
    PublicWaitlistOffer:
      type: object
      description: Bekleme teklifi sayfası (omvila.com/b/{accessCode}; BeklemeTeklif, BeklemeDoldu)
      required: [id, status, brand, branch, startUtc, endUtc, timeZone, holdExpiresUtc, generatedUtc, items, total, amountDue, waitlistAccessCode, version]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WaitlistOfferStatus' }
        brand:
          type: object
          required: [name, slug]
          properties:
            name: { type: string, example: Spa Moda }
            slug: { type: string, example: spa-moda }
            logoUrl: { type: [string, 'null'] }
        branch:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: Moda }
