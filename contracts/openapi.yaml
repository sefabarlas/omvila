      required: [activeCount, items]
      properties:
        activeCount: { type: integer, minimum: 0, description: '"2 aktif paket"', example: 2 }
        items:
          type: array
          description: Önce kullanılabilirler, sonra bitenler
          items: { $ref: '#/components/schemas/MePackage' }
    MePaymentKind:
      type: string
      description: Deposit = kapora havalesi, AppointmentPayment = salonda alınan randevu ödemesi, PackagePurchase = paket satın alma. İstemciler bilinmeyen değeri genel satır olarak gösterir
      enum: [Deposit, AppointmentPayment, PackagePurchase]
    MePaymentStatus:
      type: string
      description: AwaitingConfirmation = "Salon onayı bekleniyor" (havale bildirildi, salon onaylamadı); Recorded = kayıtlı ("Alındı"); PartiallyRefunded / Refunded = "Salon iade etti"
      enum: [AwaitingConfirmation, Recorded, PartiallyRefunded, Refunded]
    MePaymentRow:
      type: object
      description: Ödemelerim satırı (salt okunur)
      required: [id, kind, status, brand, amount, method, occurredUtc, timeZone]
      properties:
        id: { type: string, format: uuid, description: Tahsilat kaydı; AwaitingConfirmation satırında randevu kimliği }
        kind: { $ref: '#/components/schemas/MePaymentKind' }
        status: { $ref: '#/components/schemas/MePaymentStatus' }
        brand: { $ref: '#/components/schemas/MeBrandRef' }
        amount: { $ref: '#/components/schemas/Money' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        occurredUtc: { type: string, format: date-time, description: Tahsilat anı; AwaitingConfirmation satırında müşterinin bildirdiği an }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        refundedAmount: { $ref: '#/components/schemas/Money', description: Yalnız iade işaretlendiyse }
        appointmentId: { type: [string, 'null'], format: uuid, description: Kapora ve randevu ödemesinde randevu }
        appointmentStartUtc: { type: [string, 'null'], format: date-time, description: '"Alındı · 26 Kasım randevusu"' }
        serviceNames:
          type: array
          description: Randevu ödemesinde hizmetler ("Boya ve fön")
          items: { type: string }
        packageName: { type: [string, 'null'], description: Paket satın almada, example: Fön paketi }
        packageSessionCount: { type: [integer, 'null'], description: '"5 seans"', example: 5 }
    MePaymentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MePaymentRow' }
        nextCursor: { type: [string, 'null'] }
    MeConsent:
      type: object
      description: İzinlerim satırı ("Kampanya ve indirim mesajları")
      required: [brand, marketingGranted, updatedUtc]
      properties:
        brand: { $ref: '#/components/schemas/MeBrandRef' }
        marketingGranted: { type: boolean, description: Son kampanya rızası verilmiş mi }
        updatedUtc: { type: [string, 'null'], format: date-time, description: Son rıza kaydının anı; hiç kayıt yoksa null }
    MeConsentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeConsent' }
    MeMarketingConsentUpdate:
      type: object
      description: Bir markanın kampanya izni anahtarı
      required: [brandId, granted]
      properties:
        brandId: { type: string, format: uuid }
        granted: { type: boolean }
    MeAccountDeletionConfirm:
      type: object
      description: Hesap silme onay kodu (meRequestAccountDeletionOtp'tan)
      required: [otpId, code]
      properties:
        otpId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$', example: '482193' }
    MeAccountDeletionResult:
      type: object
      description: Hesap silindi (HesapSilindi)
      required: [deletedUtc, cancelledAppointmentCount]
      properties:
        deletedUtc: { type: string, format: date-time }
        cancelledAppointmentCount: { type: integer, minimum: 0, description: İptal edilen yaklaşan randevular }
    MeNotificationEvent:
      type: string
      description: |
        Müşteri uygulaması bildirim listesindeki olay kodu (docs/standartlar/bildirimler.md § Müşteri olayları; push metni olan olaylar). CustomerNotificationEvent
        salonun ezebildiği SMS şablonlarıdır; bu enum ondan ayrıdır ve deposit.received'ı da içerir. Yalnız SMS olan olaylar (otp.code, deposit.awaiting,
        deposit.not_received, walkin.almost_turn) listede yoktur. İstemciler bilinmeyen değeri genel bildirim olarak gösterir.
      enum:
        - appointment.confirmed
        - appointment.requested
        - appointment.approved
        - appointment.approval_expired
        - appointment.declined
        - appointment.reminder
        - appointment.rescheduled
        - appointment.cancelled_by_salon
        - deposit.received
        - waitlist.offer
        - review.invite
    MeNotificationTarget:
      type: object
      description: Müşteri bildirimine dokununca açılacak ekran
      required: [type]
      properties:
        type:
          type: string
          description: Appointment = RandevuDetay (appointmentId); WaitlistOffer = BeklemeTeklif (accessCode ile public waitlist-offer uçları); Review = Degerlendir (appointmentId); Booking = rezervasyon akışı (brandSlug; "Başka bir saat seçin")
          enum: [Appointment, WaitlistOffer, Review, Booking]
        appointmentId: { type: [string, 'null'], format: uuid }
        accessCode: { type: [string, 'null'], description: 'Bekleme teklifi kodu (/b/{code})' }
        brandSlug: { type: [string, 'null'] }
    MeNotification:
      type: object
      description: Müşteri bildirim satırı
      required: [id, event, title, body, createdUtc, readUtc, brand, target]
      properties:
        id: { type: string, format: uuid }
        event: { $ref: '#/components/schemas/MeNotificationEvent' }
        title: { type: string, maxLength: 80, example: Randevunuz onaylandı }
        body: { type: string, maxLength: 200, example: Kuaför Elif · Yarın 14:30. Görüşmek üzere. }
        createdUtc: { type: string, format: date-time }
        readUtc: { type: [string, 'null'], format: date-time }
        brand:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MeBrandRef'
        target: { $ref: '#/components/schemas/MeNotificationTarget' }
    MeNotificationPage:
      type: object
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MeNotification' }
        nextCursor: { type: [string, 'null'] }
        unreadCount: { type: integer, minimum: 0, example: 2 }
