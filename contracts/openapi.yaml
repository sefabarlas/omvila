  /api/v1/manage/customers/imports:
    post:
      tags: [manage-customers]
      operationId: managePreviewImport
      summary: CSV içe aktarma önizlemesi
      description: |
        MusteriIceAktar penceresi. CSV yüklenir, satırlar ayrıştırılır, hiçbir kayıt değişmez. Sütunlar başlıktan eşlenir (Ad, Telefon, Not,
        Doğum yılı, E-posta). Telefonlar E.164'e çevrilir ("0532 123 45 67", "5321234567" ve "+90 532 123 4567" aynı kişidir); markada kayıtlı
        numara "Birleşecek" sayılır (mevcut notlar korunur). Kampanya izni içe aktarılmaz.
        Boyut veya satır sınırı aşılırsa ya da dosya CSV değilse 400 validation_failed (errors.file = [too_large] / [invalid_format]); sınırlar yapılandırmadadır.
        Önizleme kaydı (CustomerImport, Previewed) oluşturduğu için Idempotency-Key ister. İzin: customer.import (Owner).
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'UTF-8 CSV (virgül veya noktalı virgül ayraçlı), ilk satır başlık' }
      responses:
        '201':
          description: Önizleme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerImportPreview'
              example:
                importId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f8a01
                fileName: musteriler-eski-program.csv
                totalRows: 1248
                toCreate: 1204
                toMerge: 38
                invalidRows: 6
                mappedColumns: [FullName, Phone, Notes]
                errors:
                  - { rowNumber: 14, column: Telefon, code: invalid_phone }
                status: Previewed
                expiresUtc: '2026-11-22T10:15:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/manage/customers/imports/{importId}/commit:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [manage-customers]
      operationId: manageCommitImport
      summary: İçe aktarmayı uygula ("1.242 kaydı içe aktar")
      description: |
        Önizlemedeki geçerli satırları uygular: yeni müşteriler Source = Import ile eklenir, kayıtlı numaralar birleşir, hatalı satırlar atlanır.
        sendInfoSms açıksa içe aktarılanların sonraki randevu bilgilendirme SMS'leri açık olur (kampanya izni verilmez).
        Kendiliğinden idempotenttir: uygulanmış önizleme tekrar gönderilirse aynı sonuç 200 ile döner. Önizlemenin süresi dolmuşsa 409 hold_expired.
        İzin: customer.import (Owner).
      security: [ { manageBearer: [] } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerImportCommitRequest'
      responses:
        '200':
          description: İçe aktarıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerImportResult'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/manage/customers/export:
    get:
      tags: [manage-customers]
      operationId: manageExportCustomers
      summary: Müşterileri CSV olarak dışa aktar ("Dışa aktar")
      description: |
        Musteriler ekranı "Dışa aktar". Markanın müşterileri (anonimleştirilmiş ve birleşmiş kayıtlar hariç), filter verilirse yalnız o filtredekiler.
        Sütunlar: Ad, Telefon, Doğum yılı, İlk kanal, İlk ziyaret, Son ziyaret, Ziyaret, Gelmedi, Toplam harcama (TL), Etiketler, Not.
        Her dışa aktarma denetim kaydına yazılır. "Tüm verileri dışa aktar" (AyarlarKvkk, e-postayla) Dilim 6'dadır.
        İzin: customer.export (Owner).
      security: [ { manageBearer: [] } ]
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [All, Regular, New, WithPackage, NoShowRisk, Lapsed60]
      responses:
        '200':
          description: CSV dosyası (UTF-8, BOM'lu; Content-Disposition attachment)
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="musteriler-2026-11-22.csv"' }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/manage/customers/{brandCustomerId}/deletion:
    parameters:
      - { name: brandCustomerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [manage-customers]
      operationId: manageGetCustomerDeletionPreview
      summary: KVKK silme talebi önizlemesi
      description: "MusteriSil penceresindeki \"Korunacak (anonim)\" ve \"Aktif paket\" bilgileri. İzin: customer.kvkk (Owner)"
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Önizleme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDeletionPreview'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [manage-customers]
      operationId: manageRequestCustomerDeletion
      summary: Kalıcı olarak anonimleştir (KVKK silme talebi)
      description: |
        MusteriSil "Kalıcı olarak anonimleştir". Geri alınamaz. Bu markadaki müşteri kaydı hemen anonimleştirilir: ad, telefon, e-posta ve notlar
        maskelenir veya silinir; randevu, ödeme ve prim kayıtları anonim olarak kalır; yaklaşan randevular iptal edilir (neden AccountDeleted,
        müşteriye bildirim gitmez); bekleme kayıtları kapanır. Global Customer kaydı ve başka markalardaki kayıtlar etkilenmez.
        DataDeletionRequest(RequestedVia = Panel, Completed) yazılır; bu müşterinin bekleyen talebi varsa o da Completed olur.
        confirmFullName müşterinin adıyla eşleşmezse 400 validation_failed (errors.confirmFullName = [mismatch]). Zaten anonimleştirilmişse 409 invalid_state_transition.
        İzin: customer.kvkk (Owner).
      security: [ { manageBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDeletionRequest'
            example:
              confirmFullName: Selin Öztürk
      responses:
        '200':
          description: Anonimleştirildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionRequestView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/manage/customers/{brandCustomerId}/reveal-phone:
    parameters:
      - name: brandCustomerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [manage-customers]
      operationId: manageRevealCustomerPhone
      summary: Maskeli numarayı arama anında aç ("Ara", "SMS")
      description: |
        İşletme uygulaması müşteri kartı ve randevu detayındaki "Ara" / "SMS" butonları. Personel rolünde MaskCustomerPhoneFromStaff açıkken listeler
        yalnız phoneMasked döner; uygulama butona basılınca bu ucu çağırır, dönen numarayla tel: / sms: bağlantısını hemen açar ve numarayı ekranda
        göstermez, saklamaz. Her çağrı denetime yazılır (AuditLog: kullanıcı, müşteri kaydı, amaç, an; numara günlüğe yazılmaz). Yanıt önbelleğe alınmaz
        (Cache-Control: no-store). İzin customer.view; customer.phone.view izni olan kullanıcı da çağırabilir (aynı denetim kaydı). Başka markanın veya
        kapsam dışı kaydın kimliği ve telefonsuz müşteri kaydı (kapıda sıra, T-86) 404 not_found. Hız sınırı 429 rate_limited.
      security: [ { manageBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRevealRequest'
            example:
              purpose: Call
      responses:
        '200':
          description: Maskesiz numara
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealedPhone'
              example:
                phone: '+905321234521'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/manage/customer-deletion-requests:
    get:
      tags: [manage-customers]
      operationId: manageListDeletionRequests
      summary: KVKK silme talepleri ("Silme talepleri")
      description: |
        AyarlarKvkk "Silme talepleri" tablosu ("30 gün içinde yanıtlanmalı"): müşteri uygulamasından gelen ve panelden yapılan talepler, yeniden eskiye.
        Bekleyen talep MusteriSil ile işlenir. Aydınlatma metni, saklama süresi ve "Tüm verileri dışa aktar" Dilim 6'dadır.
        İzin: customer.kvkk (Owner).
      security: [ { manageBearer: [] } ]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [Pending, Completed, Rejected] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Talepler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionRequestPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/manage/customer-packages:
    get:
      tags: [manage-packages]
      operationId: manageListAllCustomerPackages
      summary: Müşteri paketleri ("Müşteri paketleri" sekmesi, "Süresi yaklaşanlar")
      description: |
        Paketler ekranı "Müşteri paketleri" sekmesi ve "Süresi yaklaşanlar" kartı. filter: Active (varsayılan), ExpiringSoon (30 gün içinde biten
        Active paketler, en yakın önce), Expired, All. branchId verilirse o şubede satılan ve bütün şubelerde geçerli paketler.
        İzin: package.manage veya package.sell.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/BranchIdQueryOptional'
        - name: filter
          in: query
          required: false
          schema: { type: string, enum: [Active, ExpiringSoon, Expired, All], default: Active }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Müşteri paketleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPackagePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/manage/customer-packages/{customerPackageId}/refund:
    parameters:
      - { name: customerPackageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [manage-packages]
      operationId: manageRefundCustomerPackage
      summary: Paketi iade et
      description: |
        Salon paketi iade ettiğini işaretler; parayı kendisi öder, OMVILA yalnız kaydeder. Tutarı salon elle girer (S-10); ödenen tutarı aşamaz
        (aşarsa veya 0 ise 400 validation_failed, errors.amount = [out_of_range]).
        Yan etkiler: CustomerPackage Refunded (kalan seanslar kullanılamaz, ayrılmış seanslı yaklaşan randevular değişmez); satış ödemesi
        PartiallyRefunded veya Refunded (iade, satışın yöntemiyle kasaya o gün yazılır); satış primi için iade oranında eksi tutarlı ters kayıt.
        Paket Active veya Expired değilse 409 invalid_state_transition. Para kaydettiği için If-Match ve Idempotency-Key ister.
        İzin: package.sell (Owner, BranchManager kendi şubesinde).
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRefundRequest'
      responses:
        '200':
          description: İade işaretlendi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPackage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── manage-calendar ─────────────────────────────
  /api/v1/manage/calendar:
    get:
      tags: [manage-calendar]
      operationId: manageGetCalendar
      summary: Takvim (gün veya hafta)
      description: |
        Günlük görünüm: from = to, personel kolonları. Haftalık görünüm: 7 gün, staffIds tek personel.
        Personel rolünde yalnız kendi kolonu döner. Aralık en fazla 31 gün.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/BranchIdQuery'
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: staffIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Takvim verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/manage/branches/{branchId}/availability/slots:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    post:
      tags: [manage-calendar]
      operationId: manageSearchSlots
      summary: Panel için boş saatler ("Elif için boş saatler")
      description: Public motorun aynısıdır; MinNotice ve MaxAdvance sınırları panelde uygulanmaz, online kapalı personel ve hizmetler dahildir.
      security: [ { manageBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotSearchRequest'
      responses:
        '200':
          description: Saatler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotSearchResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/manage/appointments:
    post:
      tags: [manage-calendar]
      operationId: manageCreateAppointment
      summary: Randevu oluştur ("Yeni randevu")
      description: |
        Panel/telefon kanalında randevu Confirmed oluşur, kapora istenmez.
        Çalışma saati dışı veya izinli personel için önce 409 outside_working_hours / staff_on_time_off döner; kullanıcı onaylarsa allowOutsideWorkingHours = true ile tekrar gönderilir.
        Çakışma asla geçilemez: 409 slot_taken.
        recurrence verilirse ilk 3 aylık tekrarlar oluşur; çakışan tekrarlar skippedOccurrences içinde döner.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageAppointmentCreate'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreated'
        '400': { $ref: '#/components/responses/BadRequest' }
