    parameters:
      - { name: brandCustomerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [manage-customers]
      operationId: manageListCustomerAppointments
      summary: Müşteri kartı · Randevular sekmesi
      description: "MusteriKarti ekranı. Yeniden eskiye; tutar randevuya kopyalanan kalem fiyatlarının toplamıdır. Personel rolünde yalnız kendi randevuları döner. İzin: customer.view"
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Randevular
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerAppointmentRow' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/manage/customers/{brandCustomerId}/packages:
    parameters:
      - { name: brandCustomerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [manage-customers]
      operationId: manageListCustomerPackages
      summary: Müşteri kartı · Paketler sekmesi
      description: |
        MusteriKarti "Paketler" sekmesi ve üstteki "Fön paketi 2/5" kartı. Bütün durumlar (Active önce, sonra yeniden eskiye); usages alanı
        seans kullanımlarını gösterir (iptal edilen randevunun seansı revertedUtc ile "geri döndü"). İzin: customer.view
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Müşterinin paketleri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPackagePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [manage-customers]
      operationId: manageSellPackage
      summary: Müşteriye paket sat ("1.700 ₺ al ve paketi tanımla")
      description: |
        PaketSat penceresi. Satışta paketin adı, içeriği ve fiyatı kopyalanır; expiresOn = satış günü + validityDays (şubenin yerel takvimi).
        Yan etkiler: CustomerPackage(Active) + kalemleri; Payment(method = paymentMethod, tutar = paket fiyatı) ve CustomerPackage tahsisi (Kasa'da
        "Fön paketi · 5 seans"); satan personele CommissionEntry(Sale, Accrued) (yüzde: paketin saleCommissionPercent'i, yoksa personelin
        SaleCommissionPercent'i). Paket satışı tahsilattır; seanslar kullanıldıkça gelir sayılır.
        Paket satışta değilse (isActive = false) 409 invalid_state_transition. Satan personel satış şubesinde çalışmıyorsa 400 validation_failed
        (errors.soldByStaffId). isAvailableAllBranches = false olan paket yalnız satıldığı şubede kullanılır.
        Para kaydettiği için Idempotency-Key ister. İzin: package.sell (Owner, BranchManager kendi şubesinde).
