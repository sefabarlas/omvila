    post:
      tags: [manage-calendar]
      operationId: manageSearchSlots
      summary: Panel için boş saatler ("Elif için boş saatler")
      description: Public motorun aynısıdır; MinNotice ve MaxAdvance sınırları panelde uygulanmaz, online kapalı personel ve hizmetler dahildir.
      security: [ { manageBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotSearchRequest'
      responses:
        '200':
          description: Saatler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotSearchResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/manage/appointments:
    post:
      tags: [manage-calendar]
      operationId: manageCreateAppointment
      summary: Randevu oluştur ("Yeni randevu")
      description: |
        Panel/telefon kanalında randevu Confirmed oluşur, kapora istenmez.
        Çalışma saati dışı veya izinli personel için önce 409 outside_working_hours / staff_on_time_off döner; kullanıcı onaylarsa allowOutsideWorkingHours = true ile tekrar gönderilir.
        Çakışma asla geçilemez: 409 slot_taken.
        recurrence verilirse ilk 3 aylık tekrarlar oluşur; çakışan tekrarlar skippedOccurrences içinde döner.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageAppointmentCreate'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreated'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/TryAgain' }

