        queueDate: { type: string, format: date, description: Şubenin yerel günü }
        queueNumber: { type: integer, description: Şube + gün bazında 1'den, example: 8 }
        status: { $ref: '#/components/schemas/WalkInTicketStatus' }
        customerName: { type: string, example: Okan Er }
