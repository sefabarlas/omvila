  /api/v1/me/appointments/{appointmentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AppointmentIdPath'
    post:
      tags: [me-appointments]
      operationId: meCancelAppointment
      summary: Randevuyu iptal et ("Iptal", neden zorunlu)
      description: |
        SMS bağlantısındaki iptal (publicCancelAppointment) ile aynı kurallar (A6): neden zorunlu, son süre geçtiyse 409 cutoff_passed ("Salonu ara").
        Neden çipleri: PlanChanged "Planım değişti", Sick "Rahatsızlandım" (tasarımdaki "Hastayım" yerine; sağlık bilgisi izlenimi vermemek için), WantsDifferentTime
        "Başka saat istiyorum", Other (not zorunlu). Alınmış kapora için "iadesi salonun iade koşullarına bağlıdır" uyarısı istemcidedir; OMVILA iade yapmaz.
      security: [ { meBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCancelRequest'
            example:
              reason: PlanChanged
      responses:
        '200':
          description: İptal edildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeAppointment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

