      - $ref: '#/components/parameters/BranchIdPath'
    post:
      tags: [public-booking]
      operationId: publicCreateAppointment
      summary: Randevuyu oluştur
      description: |
        Onay veya kapora gerekiyorsa randevu PendingApproval oluşur ve holdExpiresUtc döner.
        Kapora gerekiyorsa yanıtta depositInstructions (alıcı, IBAN, tutar, açıklama kodu, son zaman) bulunur.
        Saat dolmuşsa 409 slot_taken + meta.alternatives.
      security: [ { publicBookingBearer: [] }, { meBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAppointmentCreate'
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/TryAgain' }

