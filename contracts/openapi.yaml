      type: object
      description: '"Başlat / Randevuya çevir" gövdesi (isteğe bağlı); verilmeyen alan biletteki değerdir'
      properties:
        staffId: { type: string, format: uuid, description: Bilette personel "Fark etmez" ise zorunlu }
        serviceId: { type: string, format: uuid, description: Bilette hizmet yoksa zorunlu }
