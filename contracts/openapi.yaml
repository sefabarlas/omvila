                quietHoursStartLocal: '22:00'
                quietHoursEndLocal: '08:00'
                version: 'W/"412"'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [manage-notifications]
      operationId: manageUpdateMyNotificationPreferences
      summary: Kendi bildirim tercihlerimi kaydet
      description: |
        "Bildirim ayarları" (BildirimAyar) anahtarları. Anahtarların hepsi tam gönderilir (salt okunur saat alanları yok sayılır). Değişiklik
        sonraki push'tan itibaren uygulanır; sessiz saatte ertelenmiş push'lar gönderim anındaki tercihe göre süzülür.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyNotificationPreferences'
      responses:
        '200':
          description: Kaydedildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNotificationPreferences'
        '400': { $ref: '#/components/responses/BadRequest' }
