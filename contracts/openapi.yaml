  # ───────────────────────────── me-notifications ─────────────────────────────
  /api/v1/me/devices:
    post:
      tags: [me-notifications]
      operationId: meRegisterDevice
      summary: Müşteri uygulaması push jetonunu kaydet ("BildirimIzni")
      description: |
        Müşteri kendi izin ekranımızda "Bildirimlere izin ver" dedikten sonra, açılışta ve FCM jetonu yenilendiğinde çağrılır (Device: OwnerType Customer, App Customer).
        manageRegisterDevice ile aynı kurallar: doğal anahtar push jetonudur, aynı jeton güncellenir ve aynı deviceId döner (Idempotency-Key istenmez); jeton başka
        hesaba kayıtlıysa o kayıt pasifleşir. Aktif cihaz varken müşteri bildirimleri önce push denenir, ulaşmazsa SMS'e düşer. "Şimdi değil" diyen kullanıcıda
        cihaz kaydı yoktur, hatırlatmalar SMS ile gelir (MainBildirimKapali şeridi istemcidedir).
      security: [ { meBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '200':
          description: Kaydedildi veya güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredDevice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

