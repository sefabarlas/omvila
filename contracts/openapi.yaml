openapi: 3.1.0
info:
  title: OMVILA API
  version: 0.1.0
  summary: Randevu ve salon yönetimi platformu
  license:
    name: Tescilli (tüm hakları saklıdır)
    identifier: LicenseRef-OMVILA-Proprietary
  description: |
    OMVILA'nın tek HTTP sözleşmesi. Kurallar: docs/sozlesme/api-kurallari.md.

    Kapsam (v0.1): Dilim 1 (giriş + salon kurulumu), Dilim 2 (müsaitlik + rezervasyon sayfası + panel takvimi), Dilim 3 (onay akışı + SMS + bildirimler)
    ve Dilim 4 (kapora havalesi: IBAN, Kapora geldi, hatırlatma, iade işareti, havale bildirimi).
    Sonraki dilimlerin uçları contracts/yol-haritasi.md içinde listelidir; eklenince bu dosyaya girer.

    Yüzeyler:
    - /api/v1/manage — salon paneli ve işletme uygulaması (JWT aud=manage)
    - /api/v1/public — rezervasyon sayfası ve müşteri uygulamasının randevu alma akışı
    - /api/v1/me — müşteri uygulaması (JWT aud=me) — Dilim 5
    - /api/v1/admin — platform paneli (JWT aud=admin) — Dilim 6
    - /api/v1/webhooks — dış sağlayıcı geri çağrıları (JWT yok, sağlayıcı imzası)

    Zaman: anlık zaman UTC RFC 3339; yerel tarih/saat şubenin timeZone alanına göredir.
    Para: kuruş cinsinden tamsayı (amountMinor) + currency.
servers:
  - url: http://localhost:5080
    description: Yerel backend
  - url: http://localhost:4010
    description: Prism mock (pnpm --filter contracts mock)
tags:
  - name: manage-auth
    description: Salon kullanıcısı girişi ve kaydı (telefon + SMS kodu)
  - name: manage-session
    description: Oturum bilgisi ve kurulum adımları
  - name: manage-brand
    description: İşletme bilgileri, ayarlar, rezervasyon sayfası, kapora hesabı (IBAN)
  - name: manage-branches
    description: Şubeler, çalışma saatleri, özel günler
  - name: manage-catalog
    description: Hizmet kategorileri ve hizmetler
  - name: manage-staff
    description: Personel, çalışma saatleri, izinler
  - name: manage-customers
    description: Salonun müşterileri (Dilim 2 için asgari kapsam)
  - name: manage-calendar
    description: Takvim ve randevular
  - name: manage-notifications
    description: Bildirim paneli, bildirim ve SMS ayarları, gönderen adı, cihaz kaydı, kişisel bildirim tercihleri
  - name: public-booking
    description: Rezervasyon sayfası (üyeliksiz randevu)
  - name: public-appointment-link
    description: SMS bağlantısıyla açılan randevu yönetimi
  - name: webhooks
    description: Dış sağlayıcıların geri çağrıları (JWT yok; sağlayıcı imzasıyla doğrulanır)

security: []

paths:
  # ───────────────────────────── manage-auth ─────────────────────────────
  /api/v1/manage/auth/otp/request:
    post:
      tags: [manage-auth]
      operationId: manageRequestOtp
      summary: SMS kodu iste (giriş veya kayıt)
      description: |
        "Panele giriş" ve "İşletmenizi oluşturun" ekranlarındaki "SMS kodu gönder".
        Numaranın kayıtlı olup olmadığı yanıtta açık edilmez (her durumda 202).
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageOtpRequest'
      responses:
        '202':
          description: Kod gönderildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/manage/auth/otp/verify:
    post:
      tags: [manage-auth]
      operationId: manageVerifyOtp
      summary: SMS kodunu doğrula
      description: |
        Kullanıcı varsa oturum açar (result = SignedIn). Yoksa kayıt için kısa ömürlü signupToken döner (result = SignupRequired).
        Web istemcisinde (X-Client-Type: web) yenileme jetonu HttpOnly çerez olarak döner, gövdede yer almaz.
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Doğrulandı
          headers:
            Set-Cookie:
              description: Yalnız web istemcisinde; omvila_rt yenileme çerezi
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageAuthResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/manage/auth/signup:
    post:
      tags: [manage-auth]
      operationId: manageSignup
      summary: İşletmeyi oluştur
      description: Marka, ilk şube, Owner üyeliği ve deneme aboneliği tek transaction'da oluşur.
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: İşletme oluşturuldu, oturum açıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageAuthResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/manage/auth/refresh:
    post:
      tags: [manage-auth]
      operationId: manageRefreshToken
      summary: Erişim jetonunu yenile
      description: |
        Web: yenileme çerezi otomatik gönderilir; X-Requested-With başlığı zorunludur. Mobil: gövdede refreshToken.
        Yenileme jetonu her kullanımda döndürülür.
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Yeni jetonlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/manage/auth/logout:
    post:
      tags: [manage-auth]
      operationId: manageLogout
      summary: Oturumu kapat
      security: [ { manageBearer: [] } ]
      responses:
        '204': { description: Kapatıldı }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── manage-session ─────────────────────────────
  /api/v1/manage/session:
    get:
      tags: [manage-session]
      operationId: manageGetSession
      summary: Oturumdaki kullanıcı, işletme, rol, izinler ve şubeler
      description: Panel açılışında bir kez çağrılır; menü görünürlüğü permissions listesine göre kurulur.
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Oturum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageSession'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/manage/onboarding:
    get:
      tags: [manage-session]
      operationId: manageGetOnboarding
      summary: Kurulum adımları ("İlk randevunuza 4 adım")
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Adımlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingChecklist'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/manage/onboarding/events:
    post:
      tags: [manage-session]
      operationId: manageRecordOnboardingEvent
      summary: Kurulum olayı bildir (bağlantı kopyalandı, QR indirildi, tek başıma çalışıyorum)
      security: [ { manageBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string, enum: [BookingLinkCopied, QrDownloaded, StoryImageDownloaded, SoloConfirmed] }
      responses:
        '204': { description: Kaydedildi }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── manage-brand ─────────────────────────────
  /api/v1/manage/brand:
    get:
      tags: [manage-brand]
      operationId: manageGetBrand
      summary: İşletme bilgileri
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: İşletme
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [manage-brand]
      operationId: manageUpdateBrand
      summary: İşletme bilgilerini güncelle
      description: "İzin: settings.manage"
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdate'
      responses:
        '200':
          description: Güncellendi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/manage/brand/settings:
    get:
      tags: [manage-brand]
      operationId: manageGetBrandSettings
      summary: Randevu kuralları ve kapora ayarları
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Ayarlar
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSettings'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [manage-brand]
      operationId: manageUpdateBrandSettings
      summary: Ayarları kaydet ("Değişiklikleri kaydet")
      description: "İzin: settings.manage"
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandSettings'
      responses:
        '200':
          description: Kaydedildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandSettings'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/manage/brand/booking-page:
    get:
      tags: [manage-brand]
      operationId: manageGetBookingPageSettings
      summary: Rezervasyon sayfası ayarları ve bağlantısı
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Ayarlar
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPageSettings'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [manage-brand]
      operationId: manageUpdateBookingPageSettings
      summary: Rezervasyon sayfası ayarlarını kaydet
      description: "AyarlarRezervasyon ekranı. Bağlantı adı (slug) değişirse eski bağlantı 30 gün yönlendirilir. Ad başka bir işletmede kullanılıyorsa veya başka bir işletmenin yönlendirmesi süren eski bağlantısıysa ya da ayrılmış bir adsa (r, b, d, api, giris, kayit, admin, panel, www…) 409 slug_unavailable. İzin: settings.manage"
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPageSettingsUpdate'
      responses:
        '200':
          description: Kaydedildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPageSettings'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/manage/brand/bank-account:
    get:
      tags: [manage-brand]
      operationId: manageGetBankAccount
      summary: Kaporanın gönderileceği hesap (Kapora ve IBAN)
      description: |
        Ayarlar → Kapora ve IBAN (AyarlarOdeme) formu ve Randevu kuralları (Ayarlar) kapora bölümündeki
        "Kapora IBAN'ı tanımlı · Elif Kaya · TR12 •••• 6789 01" özeti. Markada tek hesap vardır (tekil kaynak).
        Hesap hiç tanımlanmadıysa da 200 döner: configured = false, alıcı, banka ve IBAN alanları yoktur; transferCodePrefix ve
        transferWindowMinutes varsayılanlarla (OMV, 120) gelir ki form varsayılanlarla açılsın. Bu durumda ETag W/"0" olur ve ilk PUT bu değerle gönderilir.
        IBAN'ın tamamı bu uçtan hiç dönmez (ibanMasked + ibanLast4). Tam IBAN yalnız müşteriye, randevunun havale bilgisinde
        (DepositInstructions) gösterilir. İzin: settings.payment (yalnız Owner); diğer roller 403 forbidden.
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Hesap (tanımlı değilse varsayılanlarla boş form)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
              examples:
                tanimli:
                  summary: IBAN tanımlı
                  value:
                    configured: true
                    isActive: true
                    accountHolderName: Elif Kaya
                    bankName: Ziraat Bankası
                    ibanMasked: 'TR29 •••• 6789 01'
                    ibanLast4: '8901'
                    transferCodePrefix: OMV
                    transferWindowMinutes: 120
                    updatedUtc: '2026-11-20T10:15:00Z'
                    version: 'W/"5521"'
                tanimsiz:
                  summary: IBAN henüz tanımlı değil ("Kapora alınamaz · IBAN ekle")
                  value:
                    configured: false
                    isActive: false
                    transferCodePrefix: OMV
                    transferWindowMinutes: 120
                    version: 'W/"0"'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [manage-brand]
      operationId: manageUpdateBankAccount
      summary: Kapora hesabını kaydet ("Kaydet")
      description: |
        AyarlarOdeme "Kaydet". Hesap yoksa oluşturur (If-Match: W/"0"), varsa günceller (If-Match: GET'teki ETag). Hesap varken
        W/"0" gönderilirse veya ETag uyuşmazsa 412 concurrency_conflict.
        iban boşluklu veya boşluksuz, küçük harfle de gönderilebilir; sunucu boşlukları atar, büyük harfe çevirir, TR biçimini
        (TR + 24 hane, toplam 26 karakter) ve mod-97 denetim hanesini doğrular. Geçersizse 400 validation_failed, errors.iban = [invalid_format].
        iban ilk kayıtta zorunludur (yoksa errors.iban = [required]); hesap varken gönderilmezse kayıtlı IBAN korunur
        (form maskeli IBAN'ı gösterir, yalnız yeni IBAN yazılırsa gönderilir).
        transferWindowMinutes yalnız bundan sonra oluşan kaporalı randevulara uygulanır; bekleyen randevuların süresi değişmez.
        Havale süresi yalnız bu uçtan düzenlenir (BrandSettings'te alanı yoktur).
        Kayıttan sonra hesap aktiftir (isActive = true) ve BrandSettings.depositAvailable true olur.
        IBAN ve alıcı adı günlüğe yazılmaz. İzin: settings.payment (yalnız Owner).
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountWrite'
            example:
              accountHolderName: Elif Kaya
              bankName: Ziraat Bankası
              iban: 'TR29 0006 4000 0011 2345 6789 01'
              transferCodePrefix: OMV
              transferWindowMinutes: 120
      responses:
        '200':
          description: Kaydedildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
              example:
                configured: true
                isActive: true
                accountHolderName: Elif Kaya
                bankName: Ziraat Bankası
                ibanMasked: 'TR29 •••• 6789 01'
                ibanLast4: '8901'
                transferCodePrefix: OMV
                transferWindowMinutes: 120
                updatedUtc: '2026-11-25T09:30:00Z'
                version: 'W/"5540"'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  # ───────────────────────────── manage-branches ─────────────────────────────
  /api/v1/manage/branches:
    get:
      tags: [manage-branches]
      operationId: manageListBranches
      summary: Şubeler (kullanıcının kapsamındakiler)
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Şubeler
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [manage-branches]
      operationId: manageCreateBranch
      summary: Şube ekle
      description: "Plan sınırı aşılırsa 403 forbidden + meta.planLimit. İzin: settings.manage"
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
      responses:
        '201':
          description: Oluşturuldu
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/manage/branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    get:
      tags: [manage-branches]
      operationId: manageGetBranch
      summary: Şube
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Şube
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [manage-branches]
      operationId: manageUpdateBranch
      summary: Şubeyi güncelle
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
      responses:
        '200':
          description: Güncellendi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/manage/branches/{branchId}/working-hours:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    get:
      tags: [manage-branches]
      operationId: manageGetBranchWorkingHours
      summary: Şubenin haftalık çalışma saatleri
      security: [ { manageBearer: [] } ]
      responses:
        '200':
          description: Haftalık saatler
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyHours'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [manage-branches]
      operationId: manageSetBranchWorkingHours
      summary: Haftalık saatleri kaydet
      description: Günde birden çok aralık olabilir; aralıklar örtüşemez, gece yarısını aşamaz.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyHours'
      responses:
        '200':
          description: Kaydedildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyHours'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/manage/branches/{branchId}/overrides:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    get:
      tags: [manage-branches]
      operationId: manageListBranchOverrides
      summary: Özel günler ve tatiller
      security: [ { manageBearer: [] } ]
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Özel günler
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkingHoursOverride' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [manage-branches]
      operationId: manageCreateBranchOverride
      summary: Özel gün ekle ("Kapalı gün ekle", "Yalnızca bu gün için aç")
      description: Kapalı güne denk gelen randevu varsa yanıt meta.affectedAppointmentCount döner; randevular otomatik iptal edilmez.
      security: [ { manageBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
