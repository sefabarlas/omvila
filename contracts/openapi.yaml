    post:
      tags: [me-appointments]
      operationId: meRescheduleAppointment
      summary: Saati değiştir (müşteri)
      description: |
        publicRescheduleAppointment ile aynı kurallar (A14): erteleme son süresi geçtiyse 409 cutoff_passed, saat dolduysa 409 slot_taken + meta.alternatives.
        Salon onaylı çalışıyorsa randevu yeniden PendingApproval olur ("Salon onaylı çalışıyorsa yeni saat onaya düşer"); alınmış kapora yeni saate aktarılır.
      security: [ { meBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeRescheduleRequest'
            example:
              startUtc: '2026-11-28T12:15:00Z'
      responses:
        '200':
          description: Değiştirildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeAppointment'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

