        depositAmount: { $ref: '#/components/schemas/Money', description: Kabulde istenecek kapora; yoksa bulunmaz }
        appointmentAccessCode: { type: [string, 'null'], description: 'Kabul edildiyse oluşan randevunun kodu (omvila.com/r/{code})' }
        waitlistAccessCode: { type: string, description: '"Listeden çık" için bekleme kaydının kodu', example: W3nB8xQ2 }
        version: { $ref: '#/components/schemas/Version' }

