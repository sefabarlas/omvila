        requestedUtc: { type: string, format: date-time }
        dueOn: { type: string, format: date, description: 'Son gün (DeletionRequestDueDays); "Bekliyor · 28 gün"' }
        status: { type: string, enum: [Pending, Completed, Rejected] }
