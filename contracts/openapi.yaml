      type: object
      description: Maskesiz numara; istemci yalnız tel / sms bağlantısını açmak için kullanır, göstermez ve saklamaz
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneE164' }
    TodayAppointment:
      type: object
      description: Bugün ekranındaki randevu satırı ("12:00 · Deniz Acar · Saç kesimi · Can · Onay bekliyor"); işlem butonları istemcide durum ve izinden üretilir
      required: [appointmentId, startUtc, endUtc, status, displayStatus, customerName, isNewCustomer, serviceSummary, staffNames]
      properties:
        appointmentId: { type: string, format: uuid, description: Randevu kimliği (RandevuDetay) }
        startUtc: { type: string, format: date-time, description: Başlangıç }
        endUtc: { type: string, format: date-time, description: Bitiş; "45 dk" süre istemcide }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        customerName: { type: string, description: Müşteri adı, example: Derya Şahin }
        isNewCustomer: { type: boolean, description: İlk randevusu mu }
        serviceSummary: { type: string, description: 'Hizmet adları; birden çok kalemde "Boya + Fön"', example: Saç kesimi }
        staffNames:
          type: array
          description: Kalemlerin personeli (tekrarsız, kalem sırasıyla)
          items: { type: string }
          example: [Can Yücel]
        holdExpiresUtc: { type: [string, 'null'], format: date-time, description: Yalnız PendingApproval; bu anda yanıtlanmazsa otomatik iptal }
        depositStatus: { $ref: '#/components/schemas/DepositStatus', description: Yalnız kapora istenmiş randevuda bulunur }
    TodayWalkInSummary:
      type: object
      description: '"Sırada 3 · ~35 dk bekleme" kartı (WalkInQueue özeti)'
      required: [waitingCount]
      properties:
        waitingCount: { type: integer, minimum: 0, description: Sırada bekleyen, example: 3 }
        estimatedWaitMinutesForNew: { type: [integer, 'null'], description: Yeni gelen için tahmini bekleme; müsait personel yoksa null, example: 35 }
    CommissionDayAmount:
      type: object
      description: Bir günün prim toplamı (grafik noktası)
      required: [date, amountMinor]
      properties:
        date: { type: string, format: date, description: Şubenin yerel günü }
        amountMinor: { type: integer, format: int64, description: O günün prim toplamı (kuruş; ters kayıt varsa eksi olabilir), example: 42000 }
    TodayCommission:
      type: object
      description: '"KASIM PRİMİ 6.840 ₺" kartı ve çizgi grafiği'
      required: [month, totalMinor, currency, daily]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: Yıl-ay (şubenin yerel takvimi), example: '2026-11' }
        totalMinor: { type: integer, format: int64, description: Ayın kişisel prim toplamı (kuruş; ters kayıtlar düşülmüş), example: 684000 }
        currency: { type: string, enum: [TRY], description: Para birimi }
        daily:
          type: array
          description: Ayın başından bugüne prim olan günler (grafik istemcide kümülatif çizilir; kaydı olmayan gün listede yoktur)
          items: { $ref: '#/components/schemas/CommissionDayAmount' }
    ManageToday:
      type: object
      description: İşletme uygulaması "Bugün" verisi
      required: [branchId, branchName, timeZone, date, generatedUtc, next, pendingApprovalCount, walkIns, commission, completedCount, totalCount, items]
      properties:
        branchId: { type: string, format: uuid, description: Şube }
        branchName: { type: string, description: Başlıktaki şube adı ("Salı 25 Kasım · Kadıköy"), example: Kadıköy }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        date: { type: string, format: date, description: Şubenin yerel bugünü }
        generatedUtc: { type: string, format: date-time, description: Sunucunun "şimdi"si; "50 dk sonra" buna göre sayılır }
        next:
          description: '"Sıradaki": başlangıcı gelmemiş ilk Confirmed veya PendingApproval randevu; yoksa null'
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TodayAppointment'
        pendingApprovalCount: { type: [integer, 'null'], minimum: 0, description: '"Onay bekliyor" (şubedeki PendingApproval talepler); appointment.approve izni yoksa null', example: 2 }
        walkIns:
          description: Kapıda sıra özeti; walkin.manage izni yoksa null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TodayWalkInSummary'
        commission:
          description: Kişisel prim kartı; commission.view izni veya personel kaydı yoksa null
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TodayCommission'
        completedCount: { type: integer, minimum: 0, description: '"4/12 bitti": tamamlanan', example: 4 }
        totalCount: { type: integer, minimum: 0, description: '"4/12 bitti": iptal edilmemiş bütün randevular', example: 12 }
        items:
          type: array
          description: Gün akışı, başlangıca göre artan; iptal edilenler yok. Boşsa MainBos
          items: { $ref: '#/components/schemas/TodayAppointment' }
    CommissionEntryType:
      type: string
      description: Service = hizmet primi (randevu tamamlanınca), Sale = paket satış primi
      enum: [Service, Sale]
    CommissionEntryStatus:
      type: string
      description: docs/alan/durum-makinesi.md § Prim. Reversed = iptal veya iade ters kaydı (eksi tutar). İstemciler bilinmeyen değeri genel durum olarak gösterir
      enum: [Accrued, Approved, Paid, Reversed]
    MyCommissionEntry:
      type: object
      description: '"Son primler" satırı ("Ayşe Yılmaz · Bugün 09:30 · Saç kesimi · +90 ₺")'
      required: [id, type, amountMinor, status, occurredUtc, customerName, description]
      properties:
        id: { type: string, format: uuid, description: Prim kaydı }
        type: { $ref: '#/components/schemas/CommissionEntryType' }
        amountMinor: { type: integer, format: int64, description: Tutar (kuruş); Reversed kayıtta eksi, example: 9000 }
        status: { $ref: '#/components/schemas/CommissionEntryStatus' }
        occurredUtc: { type: string, format: date-time, description: 'Hizmet priminde randevu başlangıcı; satış priminde satış anı' }
        customerName: { type: string, description: Müşteri adı, example: Ayşe Yılmaz }
        description: { type: string, description: Hizmet adı veya paket adı, example: Saç kesimi }
        appointmentId: { type: [string, 'null'], format: uuid, description: Hizmet priminde randevu }
        customerPackageId: { type: [string, 'null'], format: uuid, description: Satış priminde müşteri paketi }
    CommissionWeekDay:
      type: object
      description: '"Bu hafta" çubuğu'
      required: [date, amountMinor, appointmentCount]
      properties:
        date: { type: string, format: date, description: Şubenin yerel günü }
        amountMinor: { type: integer, format: int64, description: Günün prim toplamı (kuruş), example: 42000 }
        appointmentCount: { type: integer, minimum: 0, description: Günün tamamlanan randevu sayısı ("Sal en yoğun"), example: 6 }
    MyCommissionSummary:
      type: object
      description: Kişisel prim özeti (işletme uygulaması Profil, "Primim")
      required: [staffId, staffName, timeZone, month, from, to, totalMinor, serviceRevenueMinor, currency, appointmentCount, noShowPercent, averageRating, daily, thisWeek, entries, nextAccrual]
      properties:
        staffId: { type: string, format: uuid, description: Oturumdaki kullanıcının personel kaydı }
        staffName: { type: string, example: Elif Kaya }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: Yıl-ay, example: '2026-11' }
        from: { type: string, format: date, description: Dönem başı ("1–25 Kasım") }
        to: { type: string, format: date, description: Dönem sonu; bu ayda bugün }
        totalMinor: { type: integer, format: int64, description: 'Ayın kişisel prim toplamı (kuruş; ters kayıtlar düşülmüş, eksi olabilir)', example: 684000 }
        serviceRevenueMinor: { type: integer, format: int64, description: '"Hizmet geliri" (hizmet primi tabanları; ters kayıtlar düşülmüş)', example: 2850000 }
        currency: { type: string, enum: [TRY], description: Para birimi }
        appointmentCount: { type: integer, minimum: 0, description: '"Randevu": ayda tamamlanan', example: 94 }
        noShowPercent: { type: [number, 'null'], description: '"Gelmedi %4": ayın sonuçlanan randevularında Gelmedi oranı; sonuçlanan yoksa null', example: 4 }
        averageRating: { type: [number, 'null'], description: '"Puan": son 90 gündeki değerlendirmelerin ortalaması; yoksa null', example: 4.9 }
        daily:
          type: array
          description: Ayın prim olan günleri (Bugün kartındaki çizgi)
          items: { $ref: '#/components/schemas/CommissionDayAmount' }
        thisWeek:
          type: array
          description: Bu haftanın (Pazartesi başlar) bugüne kadarki günleri
          items: { $ref: '#/components/schemas/CommissionWeekDay' }
        entries:
          type: array
          description: Ayın bütün prim kayıtları, yeniden eskiye ("Son primler" ilk satırları, "Tümü" hepsi)
          items: { $ref: '#/components/schemas/MyCommissionEntry' }
        nextAccrual:
          description: Bugün Geldi olup henüz tamamlanmamış ilk randevu ("Selin Öztürk randevusu bitince eklenecek"); yoksa null
          oneOf:
            - type: 'null'
            - type: object
              required: [appointmentId, customerName]
              properties:
                appointmentId: { type: string, format: uuid }
                customerName: { type: string, example: Selin Öztürk }

