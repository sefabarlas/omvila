      operationId: manageGetCalendar
      summary: Takvim (gün veya hafta)
      description: |
        Günlük görünüm: from = to, personel kolonları. Haftalık görünüm: 7 gün, staffIds tek personel.
        Personel rolünde yalnız kendi kolonu döner. Aralık en fazla 31 gün.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/BranchIdQuery'
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: staffIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Takvim verisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarView'
        '400': { $ref: '#/components/responses/BadRequest' }
