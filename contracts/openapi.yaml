      description: |
        Aynı hizmetler ve aynı personelle bir günün boş saatleri; randevunun kendi süresi meşgul sayılmaz. Gün şeridindeki noktalar için uygulama
        publicSearchDays'i randevunun kalemleriyle (items[].serviceId, staffId) çağırır. Son süre geçtiyse 409 cutoff_passed (ErteleKapali).
      security: [ { meBearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeRescheduleSlotSearch'
            example:
              date: '2026-11-28'
      responses:
        '200':
          description: Saatler
          content:
