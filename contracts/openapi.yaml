        appointmentId: { type: [string, 'null'], format: uuid, description: Randevuya çevrildiyse }
        version: { $ref: '#/components/schemas/Version' }
    WalkInQueue:
      type: object
      required: [branchId, date, timeZone, generatedUtc, items, waitingCount, servedCount, nextQueueNumber]
      properties:
        branchId: { type: string, format: uuid }
        date: { type: string, format: date }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        generatedUtc: { type: string, format: date-time, description: Sunucunun "şimdi"si; bekleme süreleri buna göre sayılır }
        items:
          type: array
          description: Sırada bekleyenler (Waiting, Called), numara sırasıyla
          items: { $ref: '#/components/schemas/WalkInTicketView' }
        waitingCount: { type: integer, description: '"Sırada"', example: 3 }
        oldestJoinedUtc: { type: [string, 'null'], format: date-time, description: '"en eskisi 12 dk"' }
        estimatedWaitMinutesForNew: { type: [integer, 'null'], description: '"Yeni gelen için ~35 dk"; müsait personel yoksa null', example: 35 }
        servedCount: { type: integer, description: '"Bugün sıradan · randevuya çevrildi"', example: 7 }
        nextQueueNumber: { type: integer, description: Sıraya ekle ekranındaki "No 11" (gösterim; numara oluşturmada atomik verilir), example: 11 }
    WalkInCreate:
      type: object
      description: '"Sıraya ekle" gövdesi'
      required: [branchId, fullName]
      properties:
        branchId: { type: string, format: uuid }
        brandCustomerId: { type: string, format: uuid, description: Var olan müşteri seçildiyse }
        fullName: { type: string, minLength: 2, maxLength: 120, example: Burak }
        phone: { $ref: '#/components/schemas/PhoneInput', description: İsteğe bağlı; girilirse sırası yaklaşınca SMS gider }
        serviceId: { type: [string, 'null'], format: uuid }
        preferredStaffId: { type: [string, 'null'], format: uuid, description: null = fark etmez }
