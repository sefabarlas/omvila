      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [All, Regular, New, WithPackage, NoShowRisk, Lapsed60]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Müşteriler
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerSummary' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [manage-customers]
      operationId: manageCreateCustomer
      summary: Müşteri ekle
      description: Numara markada kayıtlıysa 409 phone_already_exists + meta.brandCustomerId ("Mevcut kartı aç").
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Eklendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

