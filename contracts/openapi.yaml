    parameters:
      - { name: brandCustomerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [manage-customers]
      operationId: manageGetCustomer
      summary: Müşteri kartı (Dilim 2 kapsamı; paket, ödeme ve değerlendirme sekmeleri sonraki dilimlerde)
      security: [ { manageBearer: [] } ]
      responses:
        '200':
