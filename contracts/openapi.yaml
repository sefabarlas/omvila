  /api/v1/manage/customers:
    get:
      tags: [manage-customers]
      operationId: manageListCustomers
      summary: Müşteri ara ve listele
      description: q ad veya telefonla arar; telefonun son 4 hanesiyle de çalışır. Personel rolünde telefon maskeli döner.
