      summary: Hesap silme için SMS kodu iste ("SMS koduyla onayla ve sil", 1. adım)
      description: |
        HesapSil ekranı. Oturumdaki müşterinin kendi numarasına kod gönderir (OtpChallenge.Purpose AccountDeletion, OMVILA adıyla SMS).
        Ekrandaki önizleme ("2 yaklaşan randevunuz iptal edilecek", "Kalan paket seansları") ayrı uçtan gelmez: uygulama meListAppointments(scope = Upcoming)
        ve meListPackages yanıtlarından üretir. Sınırlar giriş koduyla aynıdır (429).
      security: [ { meBearer: [] } ]
      responses:
        '202':
          description: Kod gönderildi
          content:
            application/json:
              schema:
