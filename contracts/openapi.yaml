      tags: [manage-calendar]
      operationId: manageCreateAppointment
      summary: Randevu oluştur ("Yeni randevu")
      description: |
        Panel/telefon kanalında randevu Confirmed oluşur, kapora istenmez.
        Çalışma saati dışı veya izinli personel için önce 409 outside_working_hours / staff_on_time_off döner; kullanıcı onaylarsa allowOutsideWorkingHours = true ile tekrar gönderilir.
        Çakışma asla geçilemez: 409 slot_taken.
        recurrence verilirse ilk 3 aylık tekrarlar oluşur; çakışan tekrarlar skippedOccurrences içinde döner.
      security: [ { manageBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageAppointmentCreate'
      responses:
        '201':
          description: Oluşturuldu
