  # ───────────────────────────── webhooks ─────────────────────────────
  /api/v1/webhooks/sms/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        description: SMS sağlayıcı adaptörünün kodu (ör. netgsm). Sağlayıcı henüz seçilmedi (acik-sorular T-03); bilinmeyen kod 404.
        schema: { type: string, pattern: '^[a-z0-9-]{2,30}$', example: netgsm }
    post:
      tags: [webhooks]
      operationId: webhookSmsDeliveryReport
      summary: SMS teslim raporu (sağlayıcıdan gelen geri çağrı)
      description: |
        SMS sağlayıcısı mesaj teslim edildiğinde veya başarısız olduğunda çağırır. OMVILA JWT'si taşımaz (security: []); kimlik doğrulama
        sağlayıcıya göre adaptörde yapılır: sağlayıcının kendi imza başlığı (HMAC, ör. X-Signature) gövdenin ham baytları üzerinden ve
        ortam gizlisiyle sabit zamanlı karşılaştırılır; imza sunmayan bir sağlayıcı seçilirse yol gizli jetonu ve IP izin listesi kullanılır.
        İmzasız veya imzası tutmayan istek 401 unauthorized alır ve hiçbir kayda dokunmaz (kabul kriteri 10).
        Gövde sağlayıcıya özgüdür; sözleşme serbest biçimli JSON nesnesi olarak tanımlar, adaptör ProviderMessageId ile
        NotificationOutbox satırını bulur. Teslim edildi → Sent; başarısız → üstel geri çekilmeyle yeniden denenir, 5. denemede Failed.
        Bilinmeyen mesaj kimliği ve tekrar gelen rapor 204 ile sessizce kabul edilir (sağlayıcı tekrar denemesin; işlem idempotent).
        Form kodlu gövde gönderen bir sağlayıcı seçilirse ilgili içerik türü buraya eklenir (geriye uyumlu).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsDeliveryReportPayload'
      responses:
        '204': { description: Rapor alındı }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    manageBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Salon kullanıcısı (aud=manage)
    publicBookingBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Rezervasyon sayfası telefon doğrulama jetonu (aud=public-booking, 30 dk)
    meBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Müşteri uygulaması (aud=me)
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform kullanıcısı (aud=admin)

  headers:
    ETag:
      description: Kaynağın sürümü; değiştiren isteklerde If-Match ile geri gönderilir
      schema: { type: string, example: 'W/"8812"' }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: İstemcinin ürettiği UUID; aynı anahtarla tekrar gelen istek ilk yanıtı alır (24 saat)
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: GET yanıtındaki ETag değeri
      schema: { type: string }
    ClientType:
      name: X-Client-Type
      in: header
      required: true
      description: web ise yenileme jetonu HttpOnly çerezde, mobile ise gövdede döner
      schema: { type: string, enum: [web, mobile] }
    ClientHeader:
      name: X-Client
      in: header
      required: false
      schema: { type: string, enum: [booking-page, customer-app] }
    BranchIdPath:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BranchIdQuery:
      name: branchId
      in: query
      required: true
      schema: { type: string, format: uuid }
    BranchIdQueryOptional:
      name: branchId
      in: query
      required: false
      schema: { type: string, format: uuid }
    ServiceIdPath:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffIdPath:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentIdPath:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccessCodePath:
      name: accessCode
      in: path
      required: true
      description: SMS bağlantısındaki kod (omvila.com/r/{code} randevu, /b/{code} bekleme teklifi veya bekleme kaydı, /d/{code} değerlendirme)
      schema: { type: string, pattern: '^[A-Za-z0-9]{8,10}$' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }

  responses:
    BadRequest:
      description: Doğrulama hatası (validation_failed)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Kimlik yok veya geçersiz (unauthorized, token_expired)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Yetki yok (forbidden, booking_disabled, subscription_read_only, customer_blocked)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Bulunamadı veya kapsam dışı (not_found, access_code_invalid)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: İş kuralı çakışması (slot_taken, invalid_state_transition, cutoff_passed, hold_expired, phone_already_exists, slug_unavailable, outside_working_hours, staff_on_time_off, deposit_unavailable_no_iban, deposit_required, deposit_reminder_already_sent, payment_total_mismatch, package_session_unavailable, cash_day_already_closed, insufficient_credits, already_reviewed)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://docs.omvila.com/errors/slot_taken
            title: Slot is no longer available
            status: 409
            code: slot_taken
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            meta:
              alternatives: ['2026-11-25T11:45:00Z', '2026-11-25T12:15:00Z']
    PreconditionFailed:
      description: Kayıt başkası tarafından değiştirildi (concurrency_conflict)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Kod hatalı veya süresi dolmuş (otp_invalid, otp_expired, idempotency_key_reused)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Hız sınırı (otp_attempts_exceeded, otp_resend_too_soon, rate_limited)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TryAgain:
      description: Geçici yoğunluk (try_again); istemci bir kez otomatik tekrar dener
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ───────── temel tipler ─────────
    Problem:
      type: object
      description: RFC 9457 problem details. Kullanıcı metni istemcide code'a göre seçilir.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: object
          description: Alan yolu → hata kodları
          additionalProperties:
            type: array
            items: { type: string }
        meta:
          type: object
          description: Koda özgü ek bilgi (alternatives, attemptsLeft, retryAfterSeconds, brandCustomerId, planLimit, changedBy…)
          additionalProperties: true
    ErrorCode:
      type: string
      description: docs/sozlesme/api-kurallari.md § Hata kodu kataloğu. İstemciler bilinmeyen değeri genel hata olarak ele alır.
      enum:
        - validation_failed
        - unauthorized
        - token_expired
        - forbidden
        - booking_disabled
        - subscription_read_only
        - customer_blocked
        - not_found
        - access_code_invalid
        - slot_taken
        - invalid_state_transition
        - cutoff_passed
        - hold_expired
        - already_reviewed
        - phone_already_exists
        - slug_unavailable
        - deposit_unavailable_no_iban
        - deposit_required
        - deposit_reminder_already_sent
        - payment_total_mismatch
        - package_session_unavailable
        - cash_day_already_closed
        - outside_working_hours
        - staff_on_time_off
        - insufficient_credits
        - concurrency_conflict
        - idempotency_key_reused
        - otp_invalid
        - otp_expired
        - precondition_required
        - otp_attempts_exceeded
        - otp_resend_too_soon
        - rate_limited
        - try_again
    Money:
      type: object
      description: Kuruş cinsinden tutar
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 0, example: 45000 }
        currency: { type: string, enum: [TRY], example: TRY }
    LocalTime:
      type: string
      description: Yerel saat HH:mm (şubenin saat dilimine göre)
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: '14:30'
    PhoneE164:
      type: string
      description: E.164 telefon
      pattern: '^\+[1-9]\d{7,14}$'
      example: '+905324187705'
    PhoneInput:
      type: string
      description: Serbest biçimli telefon girişi; sunucu E.164'e çevirir ("0532 418 77 05", "5324187705", "+90 532 418 7705")
      minLength: 10
      maxLength: 20
      example: '0532 418 77 05'
    TimeZoneId:
      type: string
      description: IANA saat dilimi
      example: Europe/Istanbul
    DayOfWeek:
      type: integer
      description: ISO gün (1 = Pazartesi … 7 = Pazar)
      minimum: 1
      maximum: 7
    IndustryCode:
      type: string
      enum: [barber, hair_salon, beauty, spa, nail, dietitian, other]
    Version:
      type: string
      description: Kaynak sürümü (ETag ile aynı değer)

    # ───────── kimlik ─────────
    ManageOtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { $ref: '#/components/schemas/PhoneInput' }
        purpose: { type: string, enum: [Login, Signup] }
    OtpChallengeResponse:
      type: object
      required: [otpId, expiresInSeconds, resendAfterSeconds, phoneMasked]
      properties:
        otpId: { type: string, format: uuid }
        expiresInSeconds: { type: integer, example: 180 }
        resendAfterSeconds: { type: integer, example: 60 }
        phoneMasked: { type: string, example: '0532 *** ** 05' }
    OtpVerifyRequest:
      type: object
      required: [otpId, code]
      properties:
        otpId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$', example: '482193' }
        rememberDevice:
          type: boolean
          default: false
          description: Panelde "Bu bilgisayarda 30 gün hatırla"; rezervasyon sayfasında güvenilir cihaz çerezi
    ManageAuthResult:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [SignedIn, SignupRequired] }
        accessToken: { type: string, description: result = SignedIn }
        expiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: Yalnız mobil istemcide }
        signupToken: { type: string, description: result = SignupRequired; 15 dk geçerli }
    SignupRequest:
      type: object
      required: [signupToken, businessName, industryCode, acceptedTerms, privacyNoticeVersion]
      properties:
        signupToken: { type: string }
        businessName: { type: string, minLength: 2, maxLength: 160, example: Kuaför Elif }
        industryCode: { $ref: '#/components/schemas/IndustryCode' }
        ownerFullName: { type: string, maxLength: 120, example: Elif Kaya }
        acceptedTerms:
          type: boolean
          const: true
          description: Kullanım koşulları ve aydınlatma metni okundu
        privacyNoticeVersion: { type: string, example: '2026-11-01' }
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string, description: Yalnız mobil; web çerezle gönderir }
    TokenPair:
      type: object
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: Yalnız mobil }

    Permission:
      type: string
      description: docs/alan/roller-yetkiler.md izin kodları
      example: appointment.approve
    ManageSession:
      type: object
      required: [user, brand, membership, permissions, branches, subscription]
      properties:
        user:
          type: object
          required: [id, fullName, phoneMasked]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string, example: Elif Kaya }
            phoneMasked: { type: string }
        brand:
          type: object
          required: [id, name, slug, status]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: Kuaför Elif }
            slug: { type: string, example: kuafor-elif }
            logoUrl: { type: [string, 'null'] }
            status: { type: string, enum: [Onboarding, Active, Suspended, Archived] }
        membership:
          type: object
          required: [role, branchIds]
          properties:
            role: { type: string, enum: [Owner, BranchManager, Staff] }
            branchIds:
              type: array
              description: Boş dizi = tüm şubeler (Owner)
              items: { type: string, format: uuid }
            staffId: { type: [string, 'null'], format: uuid }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          example: [settings.manage, service.manage, staff.manage, calendar.view, customer.view, report.view, timeoff.request]
        branches:
          type: array
          items: { $ref: '#/components/schemas/BranchRef' }
        subscription:
          $ref: '#/components/schemas/SubscriptionBanner'
        smsCredits:
          type: object
          description: |
            "Kontör az" şeridi (Durumlar: "SMS kontörünüz 180'e düştü."). Yalnız settings.manage izni olan kullanıcıya döner; diğerlerinde alan yoktur.
            Ayrıntı manageGetSmsOverview'dadır.
          required: [balance, isLow]
          properties:
            balance: { type: integer, minimum: 0, description: SMS kontörü bakiyesi, example: 180 }
            isLow: { type: boolean, description: Bakiye LowCreditThreshold'un altında }
    SubscriptionBanner:
      type: object
      description: Panel şeritleri için abonelik özeti
      required: [status]
      properties:
        status: { type: string, enum: [Trialing, Active, PastDue, ReadOnly, Cancelled] }
        trialEndsOn: { type: [string, 'null'], format: date }
        pastDueSince: { type: [string, 'null'], format: date }
        readOnlyOn: { type: [string, 'null'], format: date, description: PastDue ise salt okunura geçeceği gün }
    OnboardingChecklist:
      type: object
      required: [steps, completedCount, totalCount]
      properties:
        completedCount: { type: integer, example: 1 }
        totalCount: { type: integer, example: 5 }
        steps:
          type: array
          items:
            type: object
            required: [key, done]
            properties:
              key: { type: string, enum: [BusinessCreated, WorkingHours, Services, Staff, ShareBookingLink] }
              done: { type: boolean }

    # ───────── marka ─────────
    Brand:
      type: object
      required: [id, name, slug, industryCode, status, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Kuaför Elif }
        slug: { type: string, example: kuafor-elif }
        industryCode: { $ref: '#/components/schemas/IndustryCode' }
        status: { type: string, enum: [Onboarding, Active, Suspended, Archived] }
        shortDescription: { type: [string, 'null'], maxLength: 160, example: 'Saç, bakım ve makyajda 12 yıllık deneyim.' }
        logoUrl: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        instagram: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        legalName: { type: [string, 'null'] }
        taxOffice: { type: [string, 'null'] }
        taxNumber: { type: [string, 'null'] }
        version: { $ref: '#/components/schemas/Version' }
    BrandUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        industryCode: { $ref: '#/components/schemas/IndustryCode' }
        shortDescription: { type: [string, 'null'], maxLength: 160 }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        instagram: { type: [string, 'null'], maxLength: 60 }
        website: { type: [string, 'null'], maxLength: 200 }
        legalName: { type: [string, 'null'], maxLength: 200 }
        taxOffice: { type: [string, 'null'], maxLength: 80 }
        taxNumber: { type: [string, 'null'], maxLength: 20 }
    BrandSettings:
      type: object
      description: docs/alan/sureler-ve-ayarlar.md
      required:
        - requiresApproval
        - approvalTimeoutMinutes
        - allowStaffSelection
        - allowAnyStaffOption
        - cancellationCutoffHours
        - rescheduleCutoffHours
        - noShowAfterMinutes
        - minNoticeMinutes
        - maxAdvanceDays
        - slotIntervalMinutes
        - defaultBranchTransferMinutes
        - depositPolicy
        - riskyCustomerNoShowThreshold
        - maskCustomerPhoneFromStaff
        - reminderOffsetsMinutes
        - reviewInviteEnabled
      properties:
        requiresApproval: { type: boolean }
        approvalTimeoutMinutes: { type: integer, enum: [30, 60, 120, 240] }
        allowStaffSelection: { type: boolean }
        allowAnyStaffOption: { type: boolean }
        cancellationCutoffHours: { type: integer, minimum: 0, maximum: 168 }
        rescheduleCutoffHours: { type: integer, minimum: 0, maximum: 168 }
        noShowAfterMinutes: { type: integer, minimum: 5, maximum: 120 }
        minNoticeMinutes: { type: integer, minimum: 0, maximum: 10080 }
        maxAdvanceDays: { type: integer, minimum: 1, maximum: 365 }
        slotIntervalMinutes: { type: integer, enum: [5, 10, 15] }
        defaultBranchTransferMinutes: { type: integer, minimum: 0, maximum: 240 }
        depositPolicy: { type: string, enum: [None, RiskyCustomersOnly, Always] }
        riskyCustomerNoShowThreshold: { type: integer, minimum: 1, maximum: 10 }
        maskCustomerPhoneFromStaff: { type: boolean }
        reminderOffsetsMinutes:
          type: array
          maxItems: 3
          items: { type: integer, minimum: 30, maximum: 4320 }
          example: [1440, 120]
          deprecated: true
          description: |
            Kanonik uç manageGetNotificationSettings / manageUpdateNotificationSettings'tir. Bu alan aynı saklanan değeri yansıtır ve
            geriye uyumluluk için durur: okunur ve PUT ile yazılırsa aynı değer değişir. Yeni istemci bu alanı mevcut değeriyle geri gönderir.
        reviewInviteEnabled:
          type: boolean
          deprecated: true
          description: Kanonik uç bildirim ayarlarıdır (NotificationSettings.reviewInviteEnabled); bu alan aynı değerin aynasıdır.
        depositAvailable:
          type: boolean
          readOnly: true
          description: Aktif IBAN var mı (yoksa kapora ayarları kapalı gösterilir)
        version: { $ref: '#/components/schemas/Version' }
    BookingPageSettings:
      type: object
      required: [slug, url, coverColor, showReviews, showPrices, version]
      properties:
        slug: { type: string, example: kuafor-elif }
        url: { type: string, format: uri, example: 'https://omvila.com/kuafor-elif' }
        coverColor: { type: string, enum: [petrol, mercan, kum] }
        showReviews: { type: boolean }
        showPrices: { type: boolean }
        preAppointmentNote: { type: [string, 'null'], maxLength: 200, example: 'Randevunuzdan 10 dakika önce gelmenizi rica ederiz.' }
        version: { $ref: '#/components/schemas/Version' }
    BookingPageSettingsUpdate:
      type: object
      required: [slug, coverColor, showReviews, showPrices]
      properties:
        slug: { type: string, pattern: '^[a-z0-9-]{3,60}$' }
        coverColor: { type: string, enum: [petrol, mercan, kum] }
        showReviews: { type: boolean }
        showPrices: { type: boolean }
        preAppointmentNote: { type: [string, 'null'], maxLength: 200 }

    # ───────── şube ─────────
    BranchRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Kadıköy }
    Branch:
      type: object
      required: [id, name, slug, addressLine, district, city, timeZone, isActive, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Kadıköy }
        slug: { type: string, example: kadikoy }
        addressLine: { type: string, example: 'Moda Cad. 42' }
        district: { type: string, example: Kadıköy }
        city: { type: string, example: İstanbul }
        postalCode: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        slotIntervalMinutes: { type: [integer, 'null'], enum: [5, 10, 15, null] }
        isActive: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
    BranchCreate:
      type: object
      required: [name, addressLine, district, city]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        addressLine: { type: string, maxLength: 300 }
        district: { type: string, maxLength: 80 }
        city: { type: string, maxLength: 80 }
        phone: { type: [string, 'null'] }
        copyWorkingHoursFromBranchId:
          type: [string, 'null']
          format: uuid
          description: '"Çalışma saatleri: İşletme saatleriyle aynı"'
        copyServicePricesFromBranchId:
          type: [string, 'null']
          format: uuid
          description: '"Hizmet ve fiyatlar: Kadıköy''den kopyala"'
    BranchUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        addressLine: { type: string, maxLength: 300 }
        district: { type: string, maxLength: 80 }
        city: { type: string, maxLength: 80 }
        postalCode: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        slotIntervalMinutes: { type: [integer, 'null'], enum: [5, 10, 15, null] }
        isActive: { type: boolean }
    TimeInterval:
      type: object
      required: [start, end]
      properties:
        start: { $ref: '#/components/schemas/LocalTime' }
        end: { $ref: '#/components/schemas/LocalTime' }
    WeeklyHours:
      type: object
      description: Haftalık saatler; listede olmayan gün kapalıdır. Mola iki aralık arasındaki boşluktur.
      required: [days]
      properties:
        days:
          type: array
          maxItems: 7
          items:
            type: object
            required: [dayOfWeek, intervals]
            properties:
              dayOfWeek: { $ref: '#/components/schemas/DayOfWeek' }
              intervals:
                type: array
                minItems: 1
                maxItems: 4
                items: { $ref: '#/components/schemas/TimeInterval' }
        version: { $ref: '#/components/schemas/Version' }
      example:
        days:
          - dayOfWeek: 2
            intervals: [{ start: '10:00', end: '13:00' }, { start: '13:45', end: '19:00' }]
          - dayOfWeek: 6
            intervals: [{ start: '09:00', end: '18:00' }]
    WorkingHoursOverride:
      type: object
      required: [id, date, kind, isClosed]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        kind: { type: string, enum: [Holiday, Closure, ExtraOpening, ShortDay] }
        isClosed: { type: boolean }
        intervals:
          type: array
          items: { $ref: '#/components/schemas/TimeInterval' }
        note: { type: [string, 'null'], example: Yılbaşı }
    WorkingHoursOverrideCreate:
      type: object
      required: [fromDate, kind, isClosed]
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date, description: Çok günlük kapanış için (Ramazan Bayramı · 3 gün) }
        kind: { type: string, enum: [Holiday, Closure, ExtraOpening, ShortDay] }
        isClosed: { type: boolean }
        intervals:
          type: array
          items: { $ref: '#/components/schemas/TimeInterval' }
        note: { type: [string, 'null'], maxLength: 200 }

    # ───────── katalog ─────────
    ServiceTemplate:
      type: object
      required: [id, categoryName, name, defaultDurationMinutes]
      properties:
        id: { type: string, format: uuid }
        categoryName: { type: string, example: Saç }
        name: { type: string, example: Saç kesimi }
        defaultDurationMinutes: { type: integer, example: 45 }
    ServiceCategory:
      type: object
      required: [id, name, sortOrder, isActive, serviceCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Saç }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        serviceCount: { type: integer, example: 9 }
    ServiceCategoryWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    BankAccount:
      type: object
      description: |
        Kaporanın gönderileceği salon hesabı (Ayarlar → Kapora ve IBAN, BrandBankAccount). OMVILA bu hesaba para göndermez veya hesaptan çekmez; yalnız müşteriye gösterir.
        configured = false ise hesap hiç tanımlanmamıştır: accountHolderName, bankName, ibanMasked, ibanLast4 ve updatedUtc yoktur;
        transferCodePrefix ve transferWindowMinutes varsayılanları döner. Tam IBAN bu şemada hiç bulunmaz.
      required: [configured, isActive, transferCodePrefix, transferWindowMinutes, version]
      properties:
        configured: { type: boolean, description: Hesap tanımlı mı (false = "Kapora alınamaz · IBAN ekle") }
        isActive: { type: boolean, description: Hesap kaporada kullanılıyor mu; false iken kapora istenmez (BrandSettings.depositAvailable ile aynı) }
        accountHolderName: { type: string, maxLength: 120, description: Alıcı adı (müşterinin bankasında görünecek ad), example: Elif Kaya }
        bankName: { type: string, maxLength: 80, description: Banka, example: Ziraat Bankası }
        ibanMasked:
          type: string
          description: |
            Maskeli IBAN: ilk 4 karakter + " •••• " + son 6 hane "dddd dd" gruplamasıyla (Ayarlar özetindeki "TR12 •••• 6789 01").
            İstemci dar alanda (AyarlarOdeme "Müşteri ne görür?") "••••" yerine "…" gösterebilir.
          example: 'TR29 •••• 6789 01'
        ibanLast4: { type: string, pattern: '^\d{4}$', description: IBAN'ın son 4 hanesi (listelerde), example: '8901' }
        transferCodePrefix: { type: string, pattern: '^[A-Z]{2,5}$', description: 'Açıklama kodu öneki ("OMV-7K2X"); varsayılan OMV', example: OMV }
        transferWindowMinutes: { type: integer, enum: [60, 120, 240], description: 'Havale süresi; dolarsa randevu otomatik iptal olur (A5). Varsayılan 120', example: 120 }
        updatedUtc: { type: string, format: date-time, description: Son kayıt anı }
        version: { $ref: '#/components/schemas/Version' }
    BankAccountWrite:
      type: object
      description: '"Kaydet" gövdesi. iban ilk kayıtta zorunlu, sonrasında isteğe bağlı (gönderilmezse kayıtlı IBAN korunur)'
      required: [accountHolderName, bankName, transferCodePrefix, transferWindowMinutes]
      properties:
        accountHolderName: { type: string, minLength: 2, maxLength: 120, description: Alıcı adı; hesap sahibiyle aynı olmalı, example: Elif Kaya }
        bankName: { type: string, minLength: 2, maxLength: 80, description: Banka, example: Ziraat Bankası }
        iban:
          type: string
          minLength: 26
          maxLength: 40
          description: |
            Tam IBAN girişi; boşluk ve küçük harf kabul edilir. Sunucu boşlukları atıp TR biçimini (TR + 24 hane) ve mod-97 denetim hanesini
            doğrular; geçersizse 400 validation_failed, errors.iban = [invalid_format].
          example: 'TR29 0006 4000 0011 2345 6789 01'
        transferCodePrefix: { type: string, pattern: '^[A-Z]{2,5}$', description: Açıklama kodu öneki (2–5 büyük Latin harfi), example: OMV }
        transferWindowMinutes: { type: integer, enum: [60, 120, 240], description: 'Havale süresi (1, 2 veya 4 saat)', example: 120 }
    ServiceStage:
      type: object
      required: [name, durationMinutes, staffBusy]
      properties:
        name: { type: string, maxLength: 60, example: Bekleme }
        durationMinutes: { type: integer, minimum: 5, maximum: 600 }
        staffBusy: { type: boolean, description: false = bekleme; personel başka müşteriye müsait }
    DepositRule:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [Inherit, Always, Never] }
        amount: { $ref: '#/components/schemas/Money' }
        percent: { type: number, minimum: 1, maximum: 100 }
      description: amount ve percent'ten en fazla biri dolu olur
    Service:
      type: object
      required:
        - id
        - categoryId
        - name
        - durationMinutes
        - price
        - priceDisplay
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - deposit
        - isOnlineBookable
        - isActive
        - stages
        - staffIds
        - version
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string, example: Saç kesimi }
        description: { type: [string, 'null'] }
        durationMinutes: { type: integer, example: 45 }
        price: { $ref: '#/components/schemas/Money' }
        priceDisplay: { type: string, enum: [Fixed, StartingFrom] }
        isBranchPrice: { type: boolean, description: Fiyat şubeye özel mi (branchId ile listelendiğinde) }
        bufferBeforeMinutes: { type: integer }
        bufferAfterMinutes: { type: integer }
        deposit: { $ref: '#/components/schemas/DepositRule' }
        requiresApproval: { type: [boolean, 'null'], description: null = marka ayarı }
        minNoticeMinutes: { type: [integer, 'null'] }
        maxAdvanceDays: { type: [integer, 'null'] }
        resourceTypeId: { type: [string, 'null'], format: uuid, description: Oda veya cihaz }
        isOnlineBookable: { type: boolean }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        stages:
          type: array
          items: { $ref: '#/components/schemas/ServiceStage' }
        staffIds:
          type: array
          items: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/Version' }
    ServiceWrite:
      type: object
      required: [categoryId, name, durationMinutes, price, priceDisplay, deposit, isOnlineBookable, staffIds]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        durationMinutes: { type: integer, minimum: 5, maximum: 720, description: Aşama varsa aşama toplamına eşit olmalı }
        price: { $ref: '#/components/schemas/Money' }
        priceDisplay: { type: string, enum: [Fixed, StartingFrom] }
        bufferBeforeMinutes: { type: integer, minimum: 0, maximum: 120, default: 0 }
        bufferAfterMinutes: { type: integer, minimum: 0, maximum: 120, default: 0 }
        deposit: { $ref: '#/components/schemas/DepositRule' }
        requiresApproval: { type: [boolean, 'null'] }
        minNoticeMinutes: { type: [integer, 'null'], minimum: 0 }
        maxAdvanceDays: { type: [integer, 'null'], minimum: 1, maximum: 365 }
        resourceTypeId: { type: [string, 'null'], format: uuid }
        isOnlineBookable: { type: boolean }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer }
        stages:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ServiceStage' }
        staffIds:
          type: array
          items: { type: string, format: uuid }
    BranchServicePrice:
      type: object
      required: [price, isAvailable]
      properties:
        price: { $ref: '#/components/schemas/Money' }
        durationOverrideMinutes: { type: [integer, 'null'], minimum: 5 }
        isAvailable: { type: boolean, description: false = hizmet bu şubede verilmiyor }

    # ───────── personel ─────────
    StaffSummary:
      type: object
      required: [id, fullName, calendarColor, isBookableOnline, isActive, branchIds]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, example: Elif Kaya }
        displayName: { type: [string, 'null'] }
        title: { type: [string, 'null'], example: 'Kurucu · kuaför' }
        photoUrl: { type: [string, 'null'] }
        calendarColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#0F6E5C' }
        isBookableOnline: { type: boolean }
        isActive: { type: boolean }
        branchIds:
          type: array
          items: { type: string, format: uuid }
        role: { type: [string, 'null'], enum: [Owner, BranchManager, Staff, null] }
        membershipStatus: { type: [string, 'null'], enum: [Invited, Active, Disabled, null] }
    StaffServiceAssignment:
      type: object
      required: [serviceId]
      properties:
        serviceId: { type: string, format: uuid }
        durationOverrideMinutes: { type: [integer, 'null'], minimum: 5, example: 75 }
        surcharge: { $ref: '#/components/schemas/Money' }
        commissionPercentOverride: { type: [number, 'null'] }
    StaffDetail:
      allOf:
        - $ref: '#/components/schemas/StaffSummary'
        - type: object
          required: [serviceCommissionPercent, saleCommissionPercent, services, workingHours, version]
          properties:
            phoneMasked: { type: [string, 'null'] }
            bio: { type: [string, 'null'] }
            serviceCommissionPercent: { type: number, example: 24 }
            saleCommissionPercent: { type: number, example: 10 }
            services:
              type: array
              items: { $ref: '#/components/schemas/StaffServiceAssignment' }
            workingHours:
              type: array
              items:
                type: object
                required: [branchId, hours]
                properties:
                  branchId: { type: string, format: uuid }
                  hours: { $ref: '#/components/schemas/WeeklyHours' }
            googleCalendarStatus: { type: [string, 'null'], enum: [Active, TokenExpired, Revoked, null] }
            version: { $ref: '#/components/schemas/Version' }
    StaffCreate:
      type: object
      required: [fullName, branchIds, role, calendarColor]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        phone: { $ref: '#/components/schemas/PhoneInput' }
        title: { type: [string, 'null'], maxLength: 60 }
        role: { type: string, enum: [BranchManager, Staff] }
        calendarColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        branchIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        services:
          type: array
          items: { $ref: '#/components/schemas/StaffServiceAssignment' }
        copyBranchWorkingHours: { type: boolean, default: true, description: '"İşletme saatleriyle aynı"' }
        serviceCommissionPercent: { type: number, minimum: 0, maximum: 100, default: 0 }
        saleCommissionPercent: { type: number, minimum: 0, maximum: 100, default: 0 }
        isBookableOnline: { type: boolean, default: true }
        sendInvite: { type: boolean, default: true, description: '"Davet SMS''i gönder"' }
    StaffUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        displayName: { type: [string, 'null'], maxLength: 120 }
        title: { type: [string, 'null'], maxLength: 60 }
        bio: { type: [string, 'null'], maxLength: 1000 }
        role: { type: string, enum: [BranchManager, Staff] }
        calendarColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        branchIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        serviceCommissionPercent: { type: number, minimum: 0, maximum: 100 }
        saleCommissionPercent: { type: number, minimum: 0, maximum: 100 }
        isBookableOnline: { type: boolean }
        isActive: { type: boolean }
    TimeOff:
      type: object
      required: [id, staffId, type, startUtc, endUtc, isAllDay]
      properties:
        id: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        type: { type: string, enum: [Leave, Break, Training, Sick, Other] }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        isAllDay: { type: boolean }
        note: { type: [string, 'null'] }
    TimeOffCreate:
      type: object
      required: [type, isAllDay]
      properties:
        type: { type: string, enum: [Leave, Break, Training, Sick, Other] }
        isAllDay: { type: boolean }
        fromDate: { type: string, format: date, description: isAllDay = true ise }
        toDate: { type: string, format: date, description: isAllDay = true ise (dahil) }
        startUtc: { type: string, format: date-time, description: isAllDay = false ise }
        endUtc: { type: string, format: date-time, description: isAllDay = false ise }
        note: { type: [string, 'null'], maxLength: 200 }
    TimeOffCreated:
      type: object
      required: [timeOff, affectedAppointments]
      properties:
        timeOff: { $ref: '#/components/schemas/TimeOff' }
        affectedAppointments:
          type: array
          items: { $ref: '#/components/schemas/CalendarAppointment' }

    # ───────── müşteri (asgari) ─────────
    CustomerSummary:
      type: object
      required: [id, fullName, visitCount, noShowCount, tags]
      properties:
        id: { type: string, format: uuid, description: BrandCustomer kimliği }
        fullName: { type: string, example: Selin Öztürk }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        phoneMasked: { type: string, example: '0532 *** ** 21' }
        birthYear: { type: [integer, 'null'] }
        visitCount: { type: integer, example: 12 }
        noShowCount: { type: integer, example: 0 }
        lastVisitOn: { type: [string, 'null'], format: date }
        nextAppointmentUtc: { type: [string, 'null'], format: date-time }
        totalSpent: { $ref: '#/components/schemas/Money' }
        isNew: { type: boolean }
        isNoShowRisk: { type: boolean }
        tags:
          type: array
          items: { type: string, example: Düzenli }
        notes: { type: [string, 'null'] }
    CustomerAppointmentRow:
      type: object
      description: Müşteri kartındaki randevu satırı ("21 Eki 14:00 · Fön · Elif · Tamamlandı · 450 ₺")
      required: [appointmentId, branchId, startUtc, status, displayStatus, serviceNames, staffNames, total]
      properties:
        appointmentId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        startUtc: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        serviceNames:
          type: array
          items: { type: string }
          example: [Boya, Fön]
        staffNames:
          type: array
          items: { type: string }
          example: [Elif Kaya]
        total: { $ref: '#/components/schemas/Money' }
    CustomerCreate:
      type: object
      required: [fullName, phone]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        phone: { $ref: '#/components/schemas/PhoneInput' }
        birthYear: { type: [integer, 'null'], minimum: 1900, maximum: 2026 }
        notes:
          type: [string, 'null']
          maxLength: 2000
          description: Sağlık bilgisi yazılmaz
        sendAppointmentSms: { type: boolean, default: true, description: '"Randevu bilgilendirme SMS''leri gönderilsin"' }

    # ───────── takvim ve randevu ─────────
    AppointmentStatus:
      type: string
      enum: [Draft, PendingApproval, Confirmed, CheckedIn, Completed, Cancelled, NoShow]
    DisplayStatus:
      type: string
      description: docs/alan/durum-makinesi.md § Arayüz gösterimi
      enum: [PendingApproval, DepositPending, Confirmed, CheckedIn, Completed, Cancelled, NoShow]
    AppointmentChannel:
      type: string
      enum: [Online, Panel, Phone, WalkIn]
    CancellationReason:
      type: string
      enum:
        - PlanChanged
        - Sick
        - WantsDifferentTime
        - Other
        - CustomerRequested
        - StaffUnavailable
        - DeclinedBySalon
        - ApprovalExpired
        - DepositNotReceived
        - AccountDeleted
        - BrandReadOnly
    SegmentView:
      type: object
      description: Takvim bloğu içindeki dilim; staffBusy = false olan dilim taralı "Bekleme · müsait" şerididir
      required: [startUtc, endUtc, staffBusy]
      properties:
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        staffBusy: { type: boolean }
    CalendarAppointment:
      type: object
      description: Takvim bloğu (bir kalem = bir blok)
      required: [appointmentId, itemId, staffId, startUtc, endUtc, status, displayStatus, customerName, serviceName, isRecurring, segments]
      properties:
        appointmentId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        staffId: { type: [string, 'null'], format: uuid }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        customerName: { type: string, example: Selin Öztürk }
        serviceName: { type: string, example: Boya ve fön }
        isNewCustomer: { type: boolean }
        isRecurring: { type: boolean }
        holdExpiresUtc: { type: [string, 'null'], format: date-time }
        depositStatus: { $ref: '#/components/schemas/DepositStatus', description: Yalnız kapora istenmiş randevuda bulunur (bloktaki "Havale bildirildi" işareti) }
        depositAmount: { $ref: '#/components/schemas/Money', description: İstenen kapora; yalnız kapora istenmiş randevuda bulunur }
        segments:
          type: array
          items: { $ref: '#/components/schemas/SegmentView' }
    CalendarView:
      type: object
      required: [branchId, timeZone, from, to, staff, appointments, timeOffs, days]
      properties:
        branchId: { type: string, format: uuid }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        staff:
          type: array
          items:
            type: object
            required: [staffId, fullName, calendarColor, appointmentCount, hasGapAvailability]
            properties:
              staffId: { type: string, format: uuid }
              fullName: { type: string }
              calendarColor: { type: string }
              photoUrl: { type: [string, 'null'] }
              appointmentCount: { type: integer, example: 5 }
              hasGapAvailability: { type: boolean, description: '"bekleyen var" / bekleme diliminde boşluk' }
        days:
          type: array
          items:
            type: object
            required: [date, isClosed, staffHours]
            properties:
              date: { type: string, format: date }
              isClosed: { type: boolean }
              closureNote: { type: [string, 'null'], example: 'Pazar haftalık kapalı gün' }
              branchIntervals:
                type: array
                items: { $ref: '#/components/schemas/TimeInterval' }
              staffHours:
                type: array
                items:
                  type: object
                  required: [staffId, intervals]
                  properties:
                    staffId: { type: string, format: uuid }
                    intervals:
                      type: array
                      items: { $ref: '#/components/schemas/TimeInterval' }
        appointments:
          type: array
          items: { $ref: '#/components/schemas/CalendarAppointment' }
        timeOffs:
          type: array
          items: { $ref: '#/components/schemas/TimeOff' }
    AppointmentItemView:
      type: object
      required: [id, serviceId, serviceName, startUtc, endUtc, price, status, segments]
      properties:
        id: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string, example: Saç kesimi }
        staffId: { type: [string, 'null'], format: uuid }
        staffName: { type: [string, 'null'], example: Elif Kaya }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        price: { $ref: '#/components/schemas/Money' }
        staffSurcharge: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        paidFromPackage: { type: boolean }
        status: { type: string, enum: [Active, Completed, Cancelled] }
        segments:
          type: array
          items: { $ref: '#/components/schemas/SegmentView' }
    DepositView:
      type: object
      required: [required, status]
      properties:
        required: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/DepositStatus' }
        transferCode: { type: string, example: OMV-7K2X }
        customerReportedUtc: { type: [string, 'null'], format: date-time }
        receivedUtc: { type: [string, 'null'], format: date-time }
        remindedUtc:
          type: [string, 'null']
          format: date-time
          description: Salonun "Hatırlat" ile kapora SMS'ini yeniden gönderdiği an (randevu başına en fazla bir kez); doluysa buton pasif
        refundedUtc: { type: [string, 'null'], format: date-time, description: '"Salon iade etti" işaretlendiği an' }
        refundedAmount: { $ref: '#/components/schemas/Money', description: İade edildi olarak işaretlenen tutar (alınan kaporayı aşmaz; kısmi olabilir) }
    DepositStatus:
      type: string
      description: |
        Randevu kaporasının durumu. Awaiting = havale bekleniyor; CustomerReported = müşteri "Havaleyi yaptım" dedi ("Havale bildirildi · kontrol edin");
        Received = salon "Kapora geldi" dedi; Refunded = salon iade etti olarak işaretledi ("Salon iade etti"); Waived = salon "Kaporasız onayla" dedi,
        kapora istenmiyor. İstemciler bilinmeyen değeri genel durum olarak ele alır.
      enum: [Awaiting, CustomerReported, Received, Refunded, Waived]
    AppointmentHistoryEntry:
      type: object
      required: [occurredUtc, kind]
      properties:
        occurredUtc: { type: string, format: date-time }
        kind:
          type: string
          enum: [Created, Approved, Declined, HoldExpired, Rescheduled, Cancelled, CheckedIn, NoShow, NoShowUndone, Completed, DepositReported, DepositReceived, NotificationSent, DepositWaived, DepositReminded, DepositRefunded]
          description: 'Approved = "Onaylandı" (A2), Declined = salon reddetti (A4; müşteriye iptal), HoldExpired = onay veya kapora süresi doldu, otomatik iptal (A5), DepositReported = müşteri havaleyi bildirdi, DepositReceived = "Kapora geldi" (A3), DepositWaived = "Kaporasız onayla", DepositReminded = "Hatırlat" SMS''i, DepositRefunded = "Salon iade etti". İstemciler bilinmeyen değeri genel satır olarak gösterir'
        actorName: { type: [string, 'null'] }
        detail: { type: [string, 'null'], example: 'Online talep oluşturuldu, SMS ile doğrulandı' }
    AppointmentDetail:
      type: object
      required: [id, branchId, status, displayStatus, channel, startUtc, endUtc, timeZone, customer, items, total, amountDue, isRecurring, history, version]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, description: Kısa görünen numara, example: A-20481 }
        branchId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        channel: { $ref: '#/components/schemas/AppointmentChannel' }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        holdExpiresUtc: { type: [string, 'null'], format: date-time }
        customer:
          type: object
          required: [brandCustomerId, fullName, visitCount]
          properties:
            brandCustomerId: { type: string, format: uuid }
            fullName: { type: string, example: Pınar Yalçın }
            phone: { $ref: '#/components/schemas/PhoneE164' }
            phoneMasked: { type: string }
            visitCount: { type: integer, example: 4 }
            lastVisitLabel: { type: [string, 'null'], description: 'Sunucu biçimlemez; istemci lastVisitOn''dan üretir' }
            lastVisitOn: { type: [string, 'null'], format: date }
            isNew: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/AppointmentItemView' }
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositView'
            - type: 'null'
        total: { $ref: '#/components/schemas/Money' }
        amountDue: { $ref: '#/components/schemas/Money', description: '"Salonda ödenecek"' }
        customerNote: { type: [string, 'null'] }
        staffNote: { type: [string, 'null'] }
        isRecurring: { type: boolean }
        seriesId: { type: [string, 'null'], format: uuid }
        noShowAtUtc: { type: [string, 'null'], format: date-time, description: '"Gelmezse 13:15''te otomatik Gelmedi olur"' }
        cancellation:
          oneOf:
            - type: 'null'
            - type: object
              required: [cancelledUtc, cancelledBy, reason]
              properties:
                cancelledUtc: { type: string, format: date-time }
                cancelledBy: { type: string, enum: [Customer, Salon, System] }
                reason: { $ref: '#/components/schemas/CancellationReason' }
                note: { type: [string, 'null'] }
        completedUtc: { type: [string, 'null'], format: date-time, description: '"Tamamla ve ödeme al" anı' }
        payments:
          type: array
          description: Randevuya tahsis edilen bütün tahsilatlar (kapora havalesi, salonda alınanlar, paketten düşülen kalemlerin 0 TL kaydı), eskiden yeniye. Yetkisi olmayan (payment.collect yok) kullanıcıda dönmez
          items: { $ref: '#/components/schemas/PaymentView' }
        history:
          type: array
          items: { $ref: '#/components/schemas/AppointmentHistoryEntry' }
        version: { $ref: '#/components/schemas/Version' }
    AppointmentItemRequest:
      type: object
      required: [serviceId]
      properties:
        serviceId: { type: string, format: uuid }
        staffId:
          type: [string, 'null']
          format: uuid
          description: null = fark etmez (yalnız arama ve online oluşturmada; sunucu atar)
    RecurrenceRequest:
      type: object
      required: [frequency, intervalWeeks]
      properties:
        frequency: { type: string, enum: [Weekly] }
        intervalWeeks: { type: integer, enum: [1, 2, 4] }
        endsOn: { type: [string, 'null'], format: date }
    ManageAppointmentCreate:
      type: object
      required: [branchId, channel, startUtc, items]
      properties:
        branchId: { type: string, format: uuid }
        brandCustomerId: { type: string, format: uuid, description: Var olan müşteri; newCustomer ile XOR }
        newCustomer:
          type: object
          required: [fullName, phone]
          properties:
            fullName: { type: string, minLength: 2, maxLength: 120 }
            phone: { $ref: '#/components/schemas/PhoneInput' }
        channel: { type: string, enum: [Panel, Phone, WalkIn], description: '"Nasıl geldi?"' }
        startUtc: { type: string, format: date-time, description: İlk kalemin başlangıcı; diğerleri zincirlenir }
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            allOf:
              - $ref: '#/components/schemas/AppointmentItemRequest'
              - type: object
                required: [staffId]
        staffNote: { type: [string, 'null'], maxLength: 1000 }
        recurrence: { $ref: '#/components/schemas/RecurrenceRequest' }
        notifyCustomer: { type: boolean, default: true, description: '"Müşteriye SMS gönder"' }
        allowOutsideWorkingHours: { type: boolean, default: false }
    AppointmentCreated:
      type: object
      required: [appointment, skippedOccurrences]
      properties:
        appointment: { $ref: '#/components/schemas/AppointmentDetail' }
        skippedOccurrences:
          type: array
          description: Tekrarlayan randevuda çakıştığı için oluşturulamayan tarihler
          items: { type: string, format: date }
    ManageRescheduleRequest:
      type: object
      required: [startUtc]
      properties:
        startUtc: { type: string, format: date-time }
        items:
          type: array
          description: Personel değişikliği; verilmezse mevcut personel korunur
          items:
            type: object
            required: [itemId, staffId]
            properties:
              itemId: { type: string, format: uuid }
              staffId: { type: string, format: uuid }
        scope: { type: string, enum: [ThisOnly, ThisAndFollowing], default: ThisOnly }
        notifyCustomer: { type: boolean, default: true }
        allowOutsideWorkingHours: { type: boolean, default: false }
    ManageCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [CustomerRequested, StaffUnavailable, Other] }
        note: { type: [string, 'null'], maxLength: 300 }
        scope: { type: string, enum: [ThisOnly, ThisAndFollowing], default: ThisOnly }
        notifyCustomer: { type: boolean, default: true, description: '"Müşteriye bildir"' }
        offerToWaitlist: { type: boolean, default: true, description: 'Boşalan saat bekleme listesindeki sıradaki uygun kişiye teklif edilsin (waitlist.offer, 15 dk tutma); false ise teklif motoru bu saat için çalışmaz' }

    ManageApproveRequest:
      type: object
      description: '"Onayla" gövdesi (isteğe bağlı)'
      properties:
        waiveDeposit:
          type: boolean
          default: false
          description: '"Kaporasız onayla": kapora istenmiş ve gelmemişken kapora almadan onayla. Kapora bekleniyorken gönderilmezse 409 deposit_required'

    DepositRefundRequest:
      type: object
      description: '"Salon iade etti" gövdesi; yalnız kayıt, para hareketi yok'
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Money', description: İade edilen tutar; 0'dan büyük ve alınan kaporadan küçük veya eşit }
        note: { type: [string, 'null'], maxLength: 300, description: 'Salon içi not (geçmişte görünür, müşteriye gösterilmez)' }

    # ───────── onay kuyruğu ─────────
    PendingApprovalItem:
      type: object
      description: Onay bekleyen tek talep ("Pınar Yalçın 16:00")
      required: [appointmentId, branchId, branchName, timeZone, customerName, isNewCustomer, serviceSummary, startUtc, endUtc, holdExpiresUtc, createdUtc, channel]
      properties:
        appointmentId: { type: string, format: uuid, description: Randevu kimliği (yan paneli açar) }
        reference: { type: string, description: Kısa görünen numara, example: A-20481 }
        branchId: { type: string, format: uuid, description: Şube }
        branchName: { type: string, description: Şube adı (çok şubeli markada gösterilir), example: Kadıköy }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        customerName: { type: string, description: Müşteri adı, example: Pınar Yalçın }
        isNewCustomer: { type: boolean, description: İlk randevusu mu }
        serviceSummary: { type: string, description: 'Hizmet adları; birden çok kalemde "Saç kesimi + Fön"', example: Cilt bakımı }
        staffName: { type: [string, 'null'], description: İlk kalemin personeli, example: Zeynep Aksoy }
        startUtc: { type: string, format: date-time, description: Randevu başlangıcı }
        endUtc: { type: string, format: date-time, description: Randevu bitişi }
        holdExpiresUtc: { type: string, format: date-time, description: Bu anda yanıtlanmamışsa otomatik iptal olur (A5) }
        createdUtc: { type: string, format: date-time, description: Talebin geldiği an }
        channel: { $ref: '#/components/schemas/AppointmentChannel' }
        depositStatus: { $ref: '#/components/schemas/DepositStatus', description: 'Yalnız kapora istenmiş talepte bulunur: Awaiting = "Kapora bekleniyor", CustomerReported = "Havale bildirildi · kontrol edin"' }
        depositAmount: { $ref: '#/components/schemas/Money', description: İstenen kapora; yalnız kapora istenmiş talepte bulunur }
    PendingApprovalList:
      type: object
      description: '"Dikkat isteyenler" ve "Onay bekliyor" bentosu verisi'
      required: [generatedUtc, totalCount, earliestHoldExpiresUtc, items]
      properties:
        generatedUtc: { type: string, format: date-time, description: Sunucunun "şimdi"si; kalan süre bu ana göre sayılır }
        totalCount: { type: integer, minimum: 0, description: Onay bekleyen talep sayısı ("Onay bekliyor 2"), example: 2 }
        earliestHoldExpiresUtc:
          type: [string, 'null']
          format: date-time
          description: En yakın otomatik iptal anı ("ilki 1 sa 35 dk içinde iptal olur"); liste boşsa null
        items:
          type: array
          description: holdExpiresUtc'ye göre artan sıralı
          items: { $ref: '#/components/schemas/PendingApprovalItem' }

    # ───────── bildirimler ─────────
    StaffNotificationEvent:
      type: string
      description: |
        İşletme olay kodu (docs/standartlar/bildirimler.md § İşletme olayları). Olay kodları katalogdaki biçimiyle (nokta ve alt çizgi) yazılır,
        PascalCase'e çevrilmez; tek kaynak olay kataloğudur. İstemciler bilinmeyen değeri genel bildirim olarak gösterir.
      enum:
        - staff.approval_needed
        - staff.appointment_created
        - staff.appointment_changed
        - staff.customer_checked_in
        - staff.deposit_reported
        - staff.review_received
        - staff.walkin_queue
        - staff.daily_summary
        - owner.credits_low
        - owner.subscription_payment_failed
        - owner.trial_ending
    NotificationTarget:
      type: object
      description: Bildirime dokununca açılacak ekran
      required: [type]
      properties:
        type:
          type: string
          description: 'Appointment = randevu yan paneli; Calendar = takvim (id randevu); Today = bugün; Deposit = "Kapora geldi mi?"; Reviews = değerlendirmeler; WalkInQueue = kapıda sıra; SmsCredits = Ayarlar → Bildirimler ve SMS; Subscription = Ayarlar → Abonelik'
          enum: [Appointment, Calendar, Today, Deposit, Reviews, WalkInQueue, SmsCredits, Subscription]
        id: { type: [string, 'null'], format: uuid, description: "Hedef kayıt (randevu, değerlendirme…); ekran düzeyindeki hedeflerde null" }
        holdExpiresUtc:
          type: [string, 'null']
          format: date-time
          description: Yalnız staff.approval_needed; panelde canlı kalan süre ("1 sa 35 dk kaldı") bundan sayılır. Talep yanıtlandıysa null
    InAppNotification:
      type: object
      description: Bildirim paneli satırı
      required: [id, event, title, body, createdUtc, readUtc, target]
      properties:
        id: { type: string, format: uuid, description: Bildirim kimliği }
        event: { $ref: '#/components/schemas/StaffNotificationEvent' }
        title: { type: string, maxLength: 80, description: Başlık (push başlığıyla aynı dil), example: Yeni online talep · Pınar Yalçın }
        body: { type: string, maxLength: 200, description: Metin; sağlık bilgisi ve not içeriği yazılmaz, example: 'Cilt bakımı, bugün 16:00' }
        createdUtc: { type: string, format: date-time, description: 'Olayın oluştuğu an (satırdaki "12:02", "Dün")' }
        readUtc: { type: [string, 'null'], format: date-time, description: Okundu sayıldığı an; null = okunmadı }
        branchId: { type: [string, 'null'], format: uuid, description: "Olayın şubesi; marka düzeyindeki olaylarda (kontör, abonelik) null" }
        target: { $ref: '#/components/schemas/NotificationTarget' }
    InAppNotificationPage:
      type: object
      description: Bildirim paneli sayfası
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          description: Yeniden eskiye
          items: { $ref: '#/components/schemas/InAppNotification' }
        nextCursor: { type: [string, 'null'], description: Sonraki sayfa imleci }
        unreadCount: { type: integer, minimum: 0, description: Zildeki rozet; sayfadan bağımsız toplam okunmamış, example: 3 }
    MarkNotificationsReadRequest:
      type: object
      description: notificationIds veya all = true (tam biri)
      properties:
        notificationIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Okundu sayılacak bildirimler
          items: { type: string, format: uuid }
        all: { type: boolean, description: '"Tümünü okundu say"' }
    UnreadNotificationCount:
      type: object
      description: Güncel okunmamış sayısı
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, minimum: 0, description: Zildeki rozet, example: 0 }
    CustomerNotificationEvent:
      type: string
      description: |
        Salonun metnini ezebileceği müşteri olay kodları (docs/standartlar/bildirimler.md § Müşteri olayları). otp.code ve deposit.* bilerek
        dışarıdadır: kod ve IBAN/tutar içeren mesajlar yalnız sistem metniyle gider. Hangi şablonların ezilebildiğini GET yanıtındaki templates listesi söyler.
      enum:
        - appointment.confirmed
        - appointment.requested
        - appointment.approved
        - appointment.approval_expired
        - appointment.declined
        - appointment.reminder
        - appointment.rescheduled
        - appointment.cancelled_by_salon
        - waitlist.offer
        - walkin.almost_turn
        - review.invite
    NotificationTemplateSetting:
      type: object
      description: '"Mesaj şablonları" satırı ("Sizin metniniz" / "Sistem şablonu", "Düzenle")'
      required: [eventCode, variant, channel, systemBody, customBody, variables, requiredVariables, maxLength]
      properties:
        eventCode: { $ref: '#/components/schemas/CustomerNotificationEvent' }
        variant:
          type: [string, 'null']
          maxLength: 30
          description: Aynı olayın ikinci metni (ör. aynı gün hatırlatması same_day); null = temel metin (T-53)
          example: same_day
        channel: { type: string, enum: [Sms], description: "Şablon kanalı; v1'de yalnız SMS metni ezilir, push metni sabittir" }
        systemBody: { type: string, description: Sistem şablonu (değişkenler süslü parantezle) }
        customBody: { type: [string, 'null'], description: Salon metni; null = sistem şablonu kullanılıyor }
        variables:
          type: array
          description: 'Metinde kullanılabilen değişkenler ({salon}, {tarih}…); süslü parantezsiz'
          items: { type: string }
          example: [salon, ad, tarih, saat, hizmet, personel, bağlantı]
        requiredVariables:
          type: array
          description: Salon metninde bulunması zorunlu değişkenler (ör. bağlantı)
          items: { type: string }
          example: [bağlantı]
        maxLength: { type: integer, description: En uzun gerçekçi değerlerle izin verilen GSM-7 Türkçe karakter (1 kontör), example: 155 }
    NotificationSettings:
      type: object
      description: |
        Ayarlar → Bildirimler ve SMS. reminderOffsetsMinutes ve reviewInviteEnabled için kanonik kaynak; BrandSettings'teki aynı adlı alanlar
        aynı saklanan değeri yansıtır (deprecated).
      required: [reminderOffsetsMinutes, reviewInviteEnabled, templates, version]
      properties:
        reminderOffsetsMinutes:
          type: array
          maxItems: 3
          uniqueItems: true
          description: '"Randevu hatırlatma zamanları" (dakika, randevudan önce); boş dizi = hatırlatma yok. 1440 = "1 gün önce", 120 = "2 saat önce"'
          items: { type: integer, minimum: 30, maximum: 4320 }
          example: [1440, 120]
        reviewInviteEnabled: { type: boolean, description: '"Değerlendirme daveti" (randevu tamamlandıktan sonra)' }
        templates:
          type: array
          description: Salonun ezebildiği SMS şablonları
          items: { $ref: '#/components/schemas/NotificationTemplateSetting' }
        version: { $ref: '#/components/schemas/Version' }
    NotificationSettingsUpdate:
      type: object
      description: Bildirim ayarlarını kaydetme gövdesi
      required: [reminderOffsetsMinutes, reviewInviteEnabled]
      properties:
        reminderOffsetsMinutes:
          type: array
          maxItems: 3
          uniqueItems: true
          description: Hatırlatma zamanları (dakika)
          items: { type: integer, minimum: 30, maximum: 4320 }
          example: [1440, 120]
        reviewInviteEnabled: { type: boolean, description: Değerlendirme daveti açık mı }
        templates:
          type: array
          description: Değiştirilen şablonlar; gönderilmeyen şablon olduğu gibi kalır
          items:
            type: object
            required: [eventCode, customBody]
            properties:
              eventCode: { $ref: '#/components/schemas/CustomerNotificationEvent' }
              variant: { type: [string, 'null'], maxLength: 30, description: Şablon varyantı; null = temel metin }
              customBody:
                type: [string, 'null']
                maxLength: 300
                description: Salon metni; null = sistem şablonuna dön
                example: 'Merhaba {ad}, {tarih} {saat} randevunuz onaylandı. Değişiklik ve iptal: {bağlantı}'

    # ───────── SMS ─────────
    SmsSenderStatus:
      type: string
      description: Gönderen adı durumu; None = hiç başvuru yok
      enum: [None, Pending, Approved, Rejected]
    SmsSender:
      type: object
      description: Gönderen adı (BrandSmsSender) ve SMS'lerin şu an gittiği ad
      required: [name, status, effectiveName]
      properties:
        name: { type: [string, 'null'], description: Son başvurulan ad; hiç başvuru yoksa null, example: KUAFORELIF }
        status: { $ref: '#/components/schemas/SmsSenderStatus' }
        effectiveName:
          type: string
          description: SMS'lerin şu an gittiği ad; onaylı ad yoksa platform varsayılanı OMVILA. Yeni başvuru beklerken önceki onaylı ad sürer
          example: OMVILA
        submittedUtc: { type: [string, 'null'], format: date-time, description: Başvuru anı }
        decidedUtc: { type: [string, 'null'], format: date-time, description: Onay veya ret anı }
        rejectionReason: { type: [string, 'null'], description: Ret nedeni (platform ekibinin yazdığı metin) }
    SmsSenderRequest:
      type: object
      description: Gönderen adı başvurusu
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 11
          pattern: '^(?=.*[A-Z])[A-Z0-9]{3,11}$'
          description: 3–11 karakter, büyük Latin harfi ve rakam, en az bir harf (operatör başlık kuralı)
          example: KUAFORELIF
    SmsOverview:
      type: object
      description: AyarlarBildirim üst kartları ve kontör uyarısı
      required: [creditBalance, estimatedDaysLeft, lowCreditThreshold, isLow, sentThisMonth, sender]
      properties:
        creditBalance: { type: integer, minimum: 0, description: SMS kontörü bakiyesi, example: 1240 }
        estimatedDaysLeft:
          type: [integer, 'null']
          minimum: 0
          description: '"bu tempoyla ~18 gün yeter"; son 30 günün ortalama tüketimine göre. Yeterli geçmiş yoksa veya tüketim yoksa null'
          example: 18
        lowCreditThreshold: { type: integer, description: Bu değerin altında "Kontör az" uyarısı (LowCreditThreshold), example: 200 }
        isLow: { type: boolean, description: creditBalance < lowCreditThreshold }
        sentThisMonth:
          type: object
          description: '"Bu ay gönderilen"'
          required: [month, smsCount, creditsUsed, notificationCount]
          properties:
            month: { type: string, format: date, description: Ayın ilk günü (yerel) }
            smsCount: { type: integer, minimum: 0, description: Gönderilen SMS sayısı ("862 SMS"), example: 862 }
            creditsUsed: { type: integer, minimum: 0, description: Düşülen kontör, example: 862 }
            notificationCount: { type: integer, minimum: 0, description: Bütün kanallarda gönderilen bildirim ("1.904 bildirim"), example: 1904 }
        sender: { $ref: '#/components/schemas/SmsSender' }
    SmsDeliveryReportPayload:
      type: object
      description: Sağlayıcıya özgü teslim raporu gövdesi; alanları adaptör yorumlar (T-03)
      additionalProperties: true

    # ───────── cihaz ve tercihler ─────────
    DevicePlatform:
      type: string
      description: Cihaz platformu (alan modeli Device.Platform)
      enum: [iOS, Android]
    DeviceRegistration:
      type: object
      description: Push jetonu kaydı (işletme uygulaması manageRegisterDevice, müşteri uygulaması meRegisterDevice)
      required: [platform, pushToken, appVersion]
      properties:
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        pushToken: { type: string, minLength: 20, maxLength: 4096, description: FCM kayıt jetonu }
        appVersion: { type: string, maxLength: 20, description: Uygulama sürümü, example: 1.0.3 }
    RegisteredDevice:
      type: object
      description: Kaydedilen cihaz
      required: [deviceId, platform, lastSeenUtc]
      properties:
        deviceId: { type: string, format: uuid, description: Cihaz kaydı kimliği }
        platform: { $ref: '#/components/schemas/DevicePlatform' }
        lastSeenUtc: { type: string, format: date-time, description: Son kayıt/yenileme anı }
    MyNotificationPreferences:
      type: object
      description: |
        İşletme uygulaması "Bildirim ayarları" (NotificationPreference). Anahtar → olay: newOnlineAppointment = staff.appointment_created
        (online) ve staff.approval_needed ("Onay bekleyenler dahil"); cancellationAndReschedule = staff.appointment_changed (kendi randevuları);
        customerCheckedIn = staff.customer_checked_in; walkInQueue = staff.walkin_queue; newReview = staff.review_received;
        dailySummary = staff.daily_summary. quietHoursEnabled açıkken işletme push'ları sessiz saatte gönderilmez, sabaha ertelenir.
      required: [newOnlineAppointment, cancellationAndReschedule, customerCheckedIn, walkInQueue, newReview, dailySummary, quietHoursEnabled]
      properties:
        newOnlineAppointment: { type: boolean, description: '"Yeni online randevu · Onay bekleyenler dahil"' }
        cancellationAndReschedule: { type: boolean, description: '"İptal ve saat değişikliği · Sizin randevularınızda"' }
        customerCheckedIn: { type: boolean, description: '"Müşteri geldi · Resepsiyon check-in yapınca"' }
        walkInQueue: { type: boolean, description: '"Kapıda sıra · Sıra size gelince"' }
        newReview: { type: boolean, description: '"Yeni değerlendirme · Sizi puanlayanlar"' }
        dailySummary: { type: boolean, description: '"Gün sonu özeti"' }
        dailySummaryLocalTime:
          $ref: '#/components/schemas/LocalTime'
          readOnly: true
          description: Gün sonu özetinin gönderildiği yerel saat ("Her akşam 20:00"); platform ayarı
        quietHoursEnabled: { type: boolean, description: '"Sessiz saatler"' }
        quietHoursStartLocal:
          $ref: '#/components/schemas/LocalTime'
          readOnly: true
          description: Sessiz saat başlangıcı (QuietHoursLocal, şube yerel saati)
        quietHoursEndLocal:
          $ref: '#/components/schemas/LocalTime'
          readOnly: true
          description: Sessiz saat bitişi
        version:
          $ref: '#/components/schemas/Version'
          readOnly: true
          description: Kaynak sürümü (ETag ile aynı)

    # ───────── müsaitlik ─────────
    DaySearchRequest:
      type: object
      required: [items, from, to]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/AppointmentItemRequest' }
        sameStaffForAll: { type: boolean, default: true, description: '"İki hizmet de aynı kişiden"' }
        from: { type: string, format: date }
        to: { type: string, format: date, description: En fazla 31 gün }
    DaySearchResult:
      type: object
      required: [timeZone, days]
      properties:
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        maxDate: { type: string, format: date, description: '"60 gün ileriye kadar"' }
        days:
          type: array
          items:
            type: object
            required: [date, hasAvailability]
            properties:
              date: { type: string, format: date }
              hasAvailability: { type: boolean }
              isClosed: { type: boolean }
              firstSlotUtc: { type: [string, 'null'], format: date-time }
        nextAvailableUtc:
          type: [string, 'null']
          format: date-time
          description: Aralıkta hiç boş gün yoksa ilk uygun saat ("en yakın uygun saat Cuma 10:30")
    SlotSearchRequest:
      type: object
      required: [items, date]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/AppointmentItemRequest' }
        sameStaffForAll: { type: boolean, default: true }
        date: { type: string, format: date }
    Slot:
      type: object
      required: [startUtc, localTime, period, items, total]
      properties:
        startUtc: { type: string, format: date-time }
        localTime: { $ref: '#/components/schemas/LocalTime' }
        endLocalTime: { $ref: '#/components/schemas/LocalTime' }
        period: { type: string, enum: [Morning, Afternoon, Evening], description: 'Sabah < 12:00 ≤ Öğleden sonra < 17:00 ≤ Akşam' }
        items:
          type: array
          items:
            type: object
            required: [serviceId, staffId, startUtc, endUtc]
            properties:
              serviceId: { type: string, format: uuid }
              staffId: { type: string, format: uuid }
              staffName: { type: string }
              startUtc: { type: string, format: date-time }
              endUtc: { type: string, format: date-time }
              price: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    SlotSearchResult:
      type: object
      required: [timeZone, date, slots, unavailableTimes]
      properties:
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        date: { type: string, format: date }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
        unavailableTimes:
          type: array
          description: Izgarada dolu görünen saatler (üstü çizili gösterim için)
          items: { $ref: '#/components/schemas/LocalTime' }

    # ───────── public ─────────
    PublicBrand:
      type: object
      required: [id, name, slug, bookingEnabled, coverColor, showPrices, branches]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Kuaför Elif }
        slug: { type: string, example: kuafor-elif }
        shortDescription: { type: [string, 'null'] }
        logoUrl: { type: [string, 'null'] }
        industryLabel: { type: string, example: 'Saç, bakım, makyaj' }
        coverColor: { type: string, enum: [petrol, mercan, kum] }
        showPrices: { type: boolean }
        bookingEnabled: { type: boolean }
        rating:
          description: Yalnız yayınlanmış değerlendirme sayısı ReviewPublicThreshold'u (5) geçtiyse ve salon gösteriyorsa (showReviews); ortalama son 90 gün değil tüm yayınlanmış değerlendirmelerdendir
          oneOf:
            - type: 'null'
            - type: object
              required: [average, count]
              properties:
                average: { type: number, example: 4.9 }
                count: { type: integer, example: 312 }
        branches:
          type: array
          items:
            type: object
            required: [id, name, addressLine, district, city, timeZone, openNow]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, example: Kadıköy }
              addressLine: { type: string }
              district: { type: string }
              city: { type: string }
              phone: { type: [string, 'null'] }
              latitude: { type: [number, 'null'] }
              longitude: { type: [number, 'null'] }
              timeZone: { $ref: '#/components/schemas/TimeZoneId' }
              openNow: { type: boolean }
              todayClosesAt: { oneOf: [ { $ref: '#/components/schemas/LocalTime' }, { type: 'null' } ] }
              nextOpeningUtc:
                type: [string, 'null']
                format: date-time
                description: Bugün kapalıysa ("Bugün kapalı · Yarın 10:00'da açılır")
    PublicCatalog:
      type: object
      required: [branchId, timeZone, allowStaffSelection, allowAnyStaffOption, categories, services, staff]
      properties:
        branchId: { type: string, format: uuid }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        allowStaffSelection: { type: boolean }
        allowAnyStaffOption: { type: boolean }
        priceNote: { type: [string, 'null'], example: 'Fiyatlar ve personel şubeye göre değişebilir.' }
        categories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        services:
          type: array
          items:
            type: object
            required: [id, categoryId, name, durationMinutes, priceDisplay, staffIds, hasDeposit]
            properties:
              id: { type: string, format: uuid }
              categoryId: { type: string, format: uuid }
              name: { type: string, example: Balyaj }
              description: { type: [string, 'null'], example: 'Uzunluğa göre değişir' }
              durationMinutes: { type: integer, example: 180 }
              price:
                description: showPrices false ise null
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
              priceDisplay: { type: string, enum: [Fixed, StartingFrom] }
              hasDeposit: { type: boolean, description: Bilgi amaçlı ("Kapora 300 ₺"); kesin kapora oluşturmada müşteriye göre hesaplanır }
              depositHint:
                oneOf:
                  - $ref: '#/components/schemas/Money'
                  - type: 'null'
              staffIds:
                type: array
                items: { type: string, format: uuid }
        staff:
          type: array
          items:
            type: object
            required: [id, displayName]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string, example: Elif Kaya }
              title: { type: [string, 'null'], example: 'Kurucu · en çok randevu alan' }
              photoUrl: { type: [string, 'null'] }
              surcharges:
                type: array
                description: Hizmet bazında ek ücret ("+50 ₺")
                items:
                  type: object
                  required: [serviceId, amount]
                  properties:
                    serviceId: { type: string, format: uuid }
                    amount: { $ref: '#/components/schemas/Money' }
    PublicOtpRequest:
      type: object
      required: [phone, branchId]
      properties:
        phone: { $ref: '#/components/schemas/PhoneInput' }
        branchId: { type: string, format: uuid }
    PublicOtpRequestResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [CodeSent, AlreadyVerified] }
        challenge: { $ref: '#/components/schemas/OtpChallengeResponse' }
        booking: { $ref: '#/components/schemas/BookingTokenResult' }
    BookingTokenResult:
      type: object
      required: [bookingToken, expiresInSeconds, phoneMasked]
      properties:
        bookingToken: { type: string }
        expiresInSeconds: { type: integer, example: 1800 }
        phoneMasked: { type: string, example: '0532 *** ** 67' }
        knownCustomerFirstName:
          type: [string, 'null']
          description: '"Tekrar hoş geldiniz, Ayşe"'
          example: Ayşe
    UsablePackageItem:
      type: object
      required: [customerPackageItemId, serviceId, packageName, remainingSessions, totalSessions]
      properties:
        customerPackageItemId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        packageName: { type: string, example: Fön paketi }
        remainingSessions: { type: integer, example: 7 }
        totalSessions: { type: integer, example: 10 }
        expiresOn: { type: [string, 'null'], format: date }
    PublicAppointmentCreate:
      type: object
      required: [items, startUtc, fullName, privacyNoticeAcknowledged, privacyNoticeVersion]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/AppointmentItemRequest' }
        sameStaffForAll: { type: boolean, default: true }
        startUtc: { type: string, format: date-time }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        customerNote: { type: [string, 'null'], maxLength: 500, description: '"Salona notunuz"' }
        usePackageItems:
          type: array
          description: |
            Paketten düşülecek kalemler ("Fön paketinizden düşülsün"; seçenekler publicListMyPackages'tan). Seans randevu oluşurken ayrılır, randevu iptal
            olursa geri döner, gelmedi olursa dönmez. Paketten düşülen kalem kapora ve "Salonda ödenecek" tutarına girmez. Paket kalemi bu müşterinin değilse,
            Active değilse, süresi geçmişse, kalan seansı yoksa, hizmet uyuşmuyorsa veya şubede kullanılamıyorsa 409 package_session_unavailable
          items:
            type: object
            required: [serviceId, customerPackageItemId]
            properties:
              serviceId: { type: string, format: uuid }
              customerPackageItemId: { type: string, format: uuid }
        privacyNoticeAcknowledged: { type: boolean, const: true, description: Aydınlatma metni okundu }
        privacyNoticeVersion: { type: string }
        marketingConsent: { type: boolean, default: false, description: Salonun kampanyalarından SMS ve e-posta (isteğe bağlı) }
    DepositInstructions:
      type: object
      description: Havale ekranı; tüm alanlar kopyalanabilir
      required: [accountHolderName, iban, amount, transferCode, dueUtc]
      properties:
        accountHolderName: { type: string, example: Elif Kaya }
        bankName: { type: [string, 'null'], example: Ziraat Bankası }
        iban: { type: string, description: 'Tam IBAN, boşluklu biçimde (yalnız müşteriye bu alanda döner)', example: 'TR29 0006 4000 0011 2345 6789 01' }
        amount: { $ref: '#/components/schemas/Money' }
        transferCode: { type: string, example: OMV-7K2X }
        dueUtc: { type: string, format: date-time }
    PublicAppointment:
      type: object
      required: [id, accessCode, manageUrl, status, displayStatus, brand, branch, startUtc, endUtc, timeZone, items, total, amountDue, canCancel, canReschedule, version]
      properties:
        id: { type: string, format: uuid }
        accessCode: { type: string, example: 7Kx2Pq9a }
        manageUrl: { type: string, format: uri, example: 'https://omvila.com/r/7Kx2Pq9a' }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        brand:
          type: object
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
            logoUrl: { type: [string, 'null'] }
        branch:
          type: object
          required: [id, name, addressLine, district]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            addressLine: { type: string }
            district: { type: string }
            phone: { type: [string, 'null'] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        holdExpiresUtc: { type: [string, 'null'], format: date-time }
        items:
          type: array
          items:
            type: object
            required: [serviceName, startUtc, endUtc, price, paidFromPackage]
            properties:
              serviceName: { type: string }
              staffName: { type: [string, 'null'] }
              startUtc: { type: string, format: date-time }
              endUtc: { type: string, format: date-time }
              price: { $ref: '#/components/schemas/Money' }
              paidFromPackage: { type: boolean }
        total: { $ref: '#/components/schemas/Money' }
        amountDue: { $ref: '#/components/schemas/Money' }
        deposit:
          oneOf:
            - type: 'null'
            - allOf:
                - $ref: '#/components/schemas/DepositView'
                - type: object
                  properties:
                    instructions: { $ref: '#/components/schemas/DepositInstructions' }
        canCancel: { type: boolean }
        cancelDeadlineUtc: { type: [string, 'null'], format: date-time }
        canReschedule: { type: boolean }
        rescheduleDeadlineUtc: { type: [string, 'null'], format: date-time }
        preAppointmentNote: { type: [string, 'null'] }
        cancellation:
          oneOf:
            - type: 'null'
            - type: object
              required: [cancelledUtc, cancelledBy, reason]
              properties:
                cancelledUtc: { type: string, format: date-time }
                cancelledBy: { type: string, enum: [Customer, Salon, System] }
                reason: { $ref: '#/components/schemas/CancellationReason' }
        version: { $ref: '#/components/schemas/Version' }
    CustomerCancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [PlanChanged, Sick, WantsDifferentTime, Other] }
        note: { type: [string, 'null'], maxLength: 300, description: reason = Other ise zorunlu }

    # ───────── Dilim 5: tahsilat ve kasa ─────────
    PaymentMethod:
      type: string
      description: |
        Tahsilat yöntemi. OMVILA para almaz; bu yalnız salonun kendi tahsilatının kaydıdır. Cash = nakit, Card = salonun kendi POS'u,
        Transfer = havale/EFT, PackageRedemption = paketten düşülen kalem (0 TL'lik kayıt, docs/acik-sorular.md T-86). İstemciler bilinmeyen değeri genel yöntem olarak gösterir.
      enum: [Cash, Card, Transfer, PackageRedemption]
    CollectedPaymentMethod:
      type: string
      description: Salonda elle seçilen tahsilat yöntemi ("Nakit", "Kart", "Havale"); paketten düşüm ayrı alanla istenir
      enum: [Cash, Card, Transfer]
    PaymentStatus:
      type: string
      description: Recorded = kayıtlı; PartiallyRefunded / Refunded = "Salon iade etti" (para hareketi yok, yalnız işaret); Voided = yanlış giriş iptali
      enum: [Recorded, PartiallyRefunded, Refunded, Voided]
    PaymentPurpose:
      type: string
      description: Tahsilatın hedefi (PaymentAllocation.TargetType). v1'de bir tahsilat tek hedefe tahsis edilir
      enum: [Appointment, CustomerPackage]
    CustomerRef:
      type: object
      description: Listelerdeki müşteri özeti. Personel rolünde ve MaskCustomerPhoneFromStaff açıkken phone dönmez
      required: [brandCustomerId, fullName]
      properties:
        brandCustomerId: { type: string, format: uuid }
        fullName: { type: string, example: Selin Öztürk }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        phoneMasked: { type: string, example: '0532 *** ** 21' }
    PaymentView:
      type: object
      description: |
        Bir tahsilat kaydı (Payment + tahsisi). Randevu ayrıntısında, Kasa tablosunda ve müşteri kartı Ödemeler sekmesinde aynı biçimde döner.
        Kasa satırının "Kalem" metni istemcide üretilir: purpose = Appointment ve isDeposit → "Kapora · 14:30 randevusu"; purpose = Appointment ve
        isBalanceAfterDeposit → "Boya ve fön · kalan"; purpose = CustomerPackage → "Fön paketi · 5 seans".
      required: [id, branchId, method, amount, isDeposit, status, paidUtc, purpose]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        isDeposit: { type: boolean, description: Kapora havalesi ("Kapora geldi" ile yazılan kayıt) }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        refundedAmount: { $ref: '#/components/schemas/Money', description: '"Salon iade etti" ile işaretlenen tutar; yalnız iade varsa bulunur' }
        paidUtc: { type: string, format: date-time }
        collectedByName: { type: [string, 'null'], description: Tahsilatı kaydeden kullanıcı, example: Elif Kaya }
        reference: { type: [string, 'null'], description: Havale açıklama kodu vb., example: OMV-7K2X }
        purpose: { $ref: '#/components/schemas/PaymentPurpose' }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        appointmentId: { type: [string, 'null'], format: uuid }
        appointmentStartUtc: { type: [string, 'null'], format: date-time }
        serviceNames:
          type: array
          description: Randevu tahsilatında randevunun hizmetleri
          items: { type: string }
          example: [Boya, Fön]
        isBalanceAfterDeposit: { type: boolean, description: Randevuda önceden kapora alınmıştı; bu tahsilat kalan tutardır ("kalan") }
        staffName: { type: [string, 'null'], description: 'Randevuda hizmeti veren (birden çok personelde ilk kalemin personeli), paket satışında satan personel', example: Elif Kaya }
        customerPackageId: { type: [string, 'null'], format: uuid }
        packageName: { type: [string, 'null'], example: Fön paketi }
        packageSessionCount: { type: [integer, 'null'], description: Paketteki toplam seans, example: 5 }
        recordedAfterDayClose: { type: boolean, description: Gün kapatıldıktan sonra yazıldı ("kapanıştan sonra") }
    CompletionPayment:
      type: object
      description: '"Tamamla ve ödeme al" ödeme satırı; ikinci satır "İkinci ödeme ekle"'
      required: [method, amount]
      properties:
        method: { $ref: '#/components/schemas/CollectedPaymentMethod' }
        amount: { $ref: '#/components/schemas/Money', description: 0'dan büyük olmalı }
    PackageRedemptionRequest:
      type: object
      description: '"Paketten": randevu oluşurken paketten düşülmemiş bir kalemi tamamlarken müşterinin paketinden düş'
      required: [appointmentItemId, customerPackageItemId]
      properties:
        appointmentItemId: { type: string, format: uuid }
        customerPackageItemId: { type: string, format: uuid }
    ManageCompleteRequest:
      type: object
      description: |
        "Tamamla ve ödeme al" (OdemeAl) gövdesi. payments toplamı, randevunun kalan tutarına (amountDue) eşit olmalıdır; packageRedemptions ile
        paketten düşülen kalemlerin fiyatı kalan tutardan önce çıkarılır. Kalan tutar 0 ise payments boş gönderilir.
      required: [payments]
      properties:
        payments:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/CompletionPayment' }
        packageRedemptions:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/PackageRedemptionRequest' }
    CashMethodTotal:
      type: object
      required: [amount, count]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        count: { type: integer, description: Ödeme sayısı, example: 6 }
    CashDayClosing:
      type: object
      description: Gün kapatma kaydı (CashDayClose)
      required: [expectedCash, countedCash, differenceMinor, difference, closedUtc]
      properties:
        expectedCash: { $ref: '#/components/schemas/Money' }
        countedCash: { $ref: '#/components/schemas/Money' }
        differenceMinor: { type: integer, format: int64, description: 'Sayılan − beklenen, kuruş; eksi olabilir (Money eksi taşımadığı için tamsayı)', example: -5000 }
        difference: { type: string, enum: [None, Shortage, Surplus], description: 'None = fark yok, Shortage = kasada eksik, Surplus = kasada fazla' }
        differenceNote: { type: [string, 'null'], example: Bozuk para verildi }
        closedByName: { type: [string, 'null'], example: Elif Kaya }
        closedUtc: { type: string, format: date-time }
    CashDay:
      type: object
      description: |
        Kasa ekranı (Kasa, KasaBos): şubenin bir yerel günündeki tahsilat kayıtları. Gün şubenin saat diliminde hesaplanır.
        Beklenen nakit = nakit tahsilatlar − o gün işaretlenen nakit iadeler (docs/acik-sorular.md T-86, W3). PackageRedemption kayıtları
        tabloda "Paketten · 0 ₺" olarak görünür, toplamlara tutar katmaz.
      required: [branchId, date, timeZone, status, total, cash, card, transfer, expectedCash, payments, closing]
      properties:
        branchId: { type: string, format: uuid }
        date: { type: string, format: date }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        status: { type: string, enum: [Open, Closed], description: '"gün açık" / gün kapatıldı' }
        total: { $ref: '#/components/schemas/CashMethodTotal', description: '"Bugün tahsil edilen" (PackageRedemption hariç tutar; sayı tüm kayıtlar)' }
        cash: { $ref: '#/components/schemas/CashMethodTotal' }
        card: { $ref: '#/components/schemas/CashMethodTotal' }
        transfer:
          allOf:
            - $ref: '#/components/schemas/CashMethodTotal'
            - type: object
              required: [depositAmount, otherAmount]
              properties:
                depositAmount: { $ref: '#/components/schemas/Money', description: '"600 kapora"' }
                otherAmount: { $ref: '#/components/schemas/Money', description: '"500 ödeme"' }
        cashRefunded: { $ref: '#/components/schemas/Money', description: O gün işaretlenen nakit iadeler }
        expectedCash: { $ref: '#/components/schemas/Money', description: '"kasada olmalı" / "Beklenen"' }
        payments:
          type: array
          description: Yeniden eskiye; sayfalanmaz (bir gün)
          items: { $ref: '#/components/schemas/PaymentView' }
        closing:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CashDayClosing'
    CashDayCloseRequest:
      type: object
      description: '"Günü kapat" gövdesi (Kasa sayımı)'
      required: [branchId, date, countedCash]
      properties:
        branchId: { type: string, format: uuid }
        date: { type: string, format: date, description: Kapatılan yerel gün; bugünden sonra olamaz }
        countedCash: { $ref: '#/components/schemas/Money', description: '"Sayılan nakit"' }
        differenceNote: { type: [string, 'null'], maxLength: 300, description: '"Fark açıklaması"; sayılan ile beklenen farklıysa zorunlu' }

    # ───────── Dilim 5: paketler ─────────
    PackageItemWrite:
      type: object
      required: [serviceId, sessionCount]
      properties:
        serviceId: { type: string, format: uuid }
        sessionCount: { type: integer, minimum: 1, maximum: 100, example: 6 }
    PackageWrite:
      type: object
      description: '"Paket oluştur" gövdesi. Değişiklik satılmış paketleri etkilemez (satışta ad, içerik ve fiyat kopyalanır)'
      required: [name, price, items, validityDays, isAvailableAllBranches, isActive]
      properties:
        name: { type: string, minLength: 2, maxLength: 80, example: Manikür · 6 seans }
        price: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: '"İçerik"; aynı hizmet iki kez yazılmaz'
          items: { $ref: '#/components/schemas/PackageItemWrite' }
        validityDays: { type: integer, minimum: 1, maximum: 1095, description: '"Geçerlilik", satış tarihinden itibaren gün (3 ay = 90)', example: 90 }
        saleCommissionPercent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: '"Satış primi" (Package.SaleCommissionPercentOverride); null ise satan personelin SaleCommissionPercent değeri'
          example: 10
        isAvailableAllBranches: { type: boolean, description: '"Bütün şubelerde kullanılabilir"; kapalıysa yalnız satıldığı şubede' }
        isActive: { type: boolean, description: '"Satışta" / "Satışta değil"' }
    PackageDefinition:
      type: object
      description: Paket tanımı satırı (Paketler · Paket tanımları)
      required: [id, name, price, items, totalSessions, validityDays, isAvailableAllBranches, isActive, soldCount, activeCount, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Fön paketi }
        price: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          items:
            type: object
            required: [serviceId, serviceName, sessionCount]
            properties:
              serviceId: { type: string, format: uuid }
              serviceName: { type: string, example: Fön }
              sessionCount: { type: integer, example: 5 }
        totalSessions: { type: integer, description: '"Seans" sütunu', example: 5 }
        validityDays: { type: integer, example: 90 }
        saleCommissionPercent: { type: [number, 'null'], example: 10 }
        isAvailableAllBranches: { type: boolean }
        isActive: { type: boolean }
        soldCount: { type: integer, description: '"Satılan"', example: 64 }
        activeCount: { type: integer, description: '"Aktif" (Active müşteri paketi sayısı)', example: 18 }
        version: { $ref: '#/components/schemas/Version' }
    PackageOverview:
      type: object
      description: Paketler üst kartları
      required: [activeCustomerPackages, remainingSessions, soldThisMonth, soldThisMonthAmount, expiringSoon]
      properties:
        activeCustomerPackages: { type: integer, description: '"Aktif müşteri paketi"', example: 46 }
        remainingSessions: { type: integer, description: '"kalan 182 seans"', example: 182 }
        soldThisMonth: { type: integer, description: '"Bu ay satılan" (şubenin yerel takvim ayı)', example: 12 }
        soldThisMonthAmount: { $ref: '#/components/schemas/Money' }
        expiringSoon: { type: integer, description: '"Süresi yaklaşan": 30 gün içinde biten Active paketler', example: 5 }
        usageRatePercent: { type: [number, 'null'], description: '"Kullanım oranı": süresi biten paketlerde kullanılan seans / toplam seans; süresi biten paket yoksa null', example: 81 }
    PackageList:
      type: object
      required: [items, overview]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PackageDefinition' }
        overview: { $ref: '#/components/schemas/PackageOverview' }
    CustomerPackageStatus:
      type: string
      description: Active; Expired (son kullanım tarihi geçti, günlük iş); Refunded ("İade et"); Transferred (başka müşteriye devredildi; v1'de devir ucu yok)
      enum: [Active, Expired, Refunded, Transferred]
    CustomerPackageItemView:
      type: object
      required: [customerPackageItemId, serviceId, serviceName, totalSessions, remainingSessions]
      properties:
        customerPackageItemId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        serviceName: { type: string, example: Fön }
        totalSessions: { type: integer, example: 5 }
        remainingSessions: { type: integer, description: Defterden hesaplanır (geri dönen kullanım sayılmaz), example: 2 }
    PackageSessionUsageView:
      type: object
      description: Seans kullanımı; randevu iptal edildiyse revertedUtc dolu ("seans geri döndü")
      required: [appointmentId, serviceName, appointmentStartUtc, usedUtc]
      properties:
        appointmentId: { type: string, format: uuid }
        serviceName: { type: string, example: Fön }
        appointmentStartUtc: { type: string, format: date-time }
        usedUtc: { type: string, format: date-time }
        revertedUtc: { type: [string, 'null'], format: date-time }
    CustomerPackage:
      type: object
      description: Müşterinin satın aldığı paket ("Fön paketi · 2/5 seans kaldı · 31 Ara")
      required: [id, customer, packageId, packageName, branchId, isAvailableAllBranches, price, purchasedUtc, expiresOn, status, items, totalSessions, remainingSessions, version]
      properties:
        id: { type: string, format: uuid }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        packageId: { type: string, format: uuid }
        packageName: { type: string, example: Fön paketi }
        branchId: { type: string, format: uuid, description: Satıldığı şube }
        isAvailableAllBranches: { type: boolean }
        price: { $ref: '#/components/schemas/Money', description: Ödenen tutar }
        purchasedUtc: { type: string, format: date-time }
        expiresOn: { type: string, format: date, description: Son kullanım günü (şubenin yerel takvimi) }
        soldByStaffId: { type: [string, 'null'], format: uuid }
        soldByStaffName: { type: [string, 'null'], example: Elif Kaya }
        status: { $ref: '#/components/schemas/CustomerPackageStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerPackageItemView' }
        totalSessions: { type: integer, example: 5 }
        remainingSessions: { type: integer, example: 2 }
        refundedAmount: { $ref: '#/components/schemas/Money', description: Yalnız iade edildiyse }
        refundedUtc: { type: [string, 'null'], format: date-time }
        usages:
          type: array
          description: Yalnız müşteri kartı Paketler sekmesinde döner (yeniden eskiye)
          items: { $ref: '#/components/schemas/PackageSessionUsageView' }
        version: { $ref: '#/components/schemas/Version' }
    CustomerPackagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerPackage' }
        nextCursor: { type: [string, 'null'] }
    PackageSaleRequest:
      type: object
      description: '"Müşteriye paket sat" (PaketSat) gövdesi. Tutar paket fiyatıdır; indirim yoktur'
      required: [packageId, branchId, soldByStaffId, paymentMethod]
      properties:
        packageId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, description: Satışın yapıldığı şube (kasaya bu şubede yazılır) }
        soldByStaffId: { type: string, format: uuid, description: '"Satan personel"; satış primi ona yazılır' }
        paymentMethod: { $ref: '#/components/schemas/CollectedPaymentMethod' }
    PackageRefundRequest:
      type: object
      description: Paket iadesi gövdesi; salon iadeyi kendisi yapar, OMVILA yalnız kaydeder. Tutarı salon elle girer (S-10)
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Money', description: '0''dan büyük, ödenen tutardan küçük veya eşit' }
        note: { type: [string, 'null'], maxLength: 300, description: Salon içi not }

    # ───────── Dilim 5: değerlendirmeler ─────────
    ReviewView:
      type: object
      description: Değerlendirme kartı (Degerlendirmeler, müşteri kartı Değerlendirmeler sekmesi)
      required: [id, appointmentId, branchId, rating, customer, serviceNames, createdUtc, isPublished, reply]
      properties:
        id: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5, example: 3 }
        comment: { type: [string, 'null'], example: İşlem güzeldi ama 20 dakika bekledim. }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        serviceNames:
          type: array
          items: { type: string }
          example: [Kaş ve kirpik]
        staffId: { type: [string, 'null'], format: uuid }
        staffName: { type: [string, 'null'], example: Zeynep Ak }
        createdUtc: { type: string, format: date-time }
        isPublished: { type: boolean, description: Rezervasyon sayfasında gösterilebilir }
        reply:
          oneOf:
            - type: 'null'
            - type: object
              required: [text, repliedUtc]
              properties:
