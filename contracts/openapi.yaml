      parameters:
        - name: brandSlug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{3,60}$' }
      responses:
        '200':
          description: Salon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBrand'
        '301':
          description: Bağlantı adı değişti; Location yeni adrese yönlendirir
          headers:
            Location: { schema: { type: string } }
