      type: object
      required: [confirmFullName]
      properties:
        confirmFullName: { type: string, maxLength: 120, description: '"Onaylamak için müşterinin adını yazın"; ad ile birebir (büyük/küçük harf ve baştaki/sondaki boşluk yok sayılarak) eşleşmeli' }
