        startUtc: { type: string, format: date-time }
        endUtc: { type: string, format: date-time }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        holdExpiresUtc: { type: string, format: date-time }
        generatedUtc: { type: string, format: date-time, description: Sunucunun "şimdi"si; geri sayım holdExpiresUtc − generatedUtc ile başlar (cihaz saati kullanılmaz) }
        items:
          type: array
          items:
