                customer: { brandCustomerId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5b13, fullName: Melis Tunç, phoneMasked: '0532 *** ** 64' }
                packageId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f7b01
                packageName: Manikür · 6 seans
                branchId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5a01
                isAvailableAllBranches: true
                price: { amountMinor: 170000, currency: TRY }
                purchasedUtc: '2026-11-22T09:15:00Z'
                expiresOn: '2027-02-20'
                soldByStaffId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5e42
                soldByStaffName: Elif Kaya
                status: Active
                items:
                  - { customerPackageItemId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f7c01, serviceId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5d35, serviceName: Manikür, totalSessions: 6, remainingSessions: 6 }
                totalSessions: 6
                remainingSessions: 6
                version: 'W/"9301"'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
