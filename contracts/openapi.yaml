  # ───────────────────────────── public-waitlist ─────────────────────────────
  /api/v1/public/branches/{branchId}/waitlist:
    parameters:
      - $ref: '#/components/parameters/BranchIdPath'
    post:
      tags: [public-waitlist]
      operationId: publicJoinWaitlist
      summary: Bekleme listesine katıl ("Bekleme listesine katıl")
      description: |
        Rezervasyon sayfası DoluGun ve müşteri uygulaması BeklemeKatil. Telefon doğrulamasından sonra çağrılır (publicBookingBearer veya meBearer).
        Kayıt WaitlistEntry(Waiting, Source = Online) olur; müşteri kaydı yoksa açılır (aydınlatma metni onayı randevudaki gibi kaydedilir).
        Aynı müşterinin aynı şubede aynı hizmetler için Waiting kaydı varsa yenisi açılmaz; tercihleri güncellenir ve 200 ile döner.
        Uygun saat boşalınca waitlist.offer gider (push → SMS) ve 15 dk tutulur. Engellenmiş müşteri 403 customer_blocked; online randevu kapalıysa
        403 booking_disabled.
      security: [ { publicBookingBearer: [] }, { meBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicWaitlistJoin'
            example:
              preferences:
                serviceIds: [0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5d33]
                preferredStaffId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5e42
                acceptOtherStaff: false
                dates: ['2026-11-27']
                timeWindows: [Afternoon, Evening]
              fullName: Merve Yıldız
              privacyNoticeAcknowledged: true
              privacyNoticeVersion: '2026-11-01'
      responses:
        '201':
          description: Listeye katıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWaitlistEntry'
        '200':
          description: Zaten listedeydi; tercihler güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWaitlistEntry'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/public/waitlist-offers/{accessCode}:
    parameters:
      - $ref: '#/components/parameters/AccessCodePath'
    get:
      tags: [public-waitlist]
      operationId: publicGetWaitlistOffer
      summary: Bekleme teklifi ("Beklediğiniz saat boşaldı")
      description: |
        Teklif bağlantısı (omvila.com/b/{accessCode}; BeklemeTeklif, BeklemeDoldu). Bağlantı telefonu doğrular, kod istenmez.
        Süresi dolmuş, reddedilmiş veya geri alınmış teklif de 200 ile döner (status Expired, Declined, Withdrawn); ekran BeklemeDoldu gösterir.
        Kod geçersizse 404 access_code_invalid.
      responses:
        '200':
          description: Teklif
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWaitlistOffer'
              example:
                id: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4fa102
                status: Pending
                brand: { name: Spa Moda, slug: spa-moda, logoUrl: null }
                branch: { id: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f5a09, name: Moda }
                customerFirstName: Merve
                startUtc: '2026-11-28T13:00:00Z'
                endUtc: '2026-11-28T14:00:00Z'
                timeZone: Europe/Istanbul
                holdExpiresUtc: '2026-11-25T09:15:00Z'
                generatedUtc: '2026-11-25T09:05:55Z'
                items:
                  - { serviceName: Masaj, staffName: Seda Kurt, durationMinutes: 60, price: { amountMinor: 90000, currency: TRY } }
                total: { amountMinor: 90000, currency: TRY }
                amountDue: { amountMinor: 90000, currency: TRY }
                requiresApproval: false
                appointmentAccessCode: null
                waitlistAccessCode: W3nB8xQ2
                version: 'W/"9420"'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/public/waitlist-offers/{accessCode}/accept:
    parameters:
      - $ref: '#/components/parameters/AccessCodePath'
    post:
      tags: [public-waitlist]
      operationId: publicAcceptWaitlistOffer
      summary: Teklifi kabul et ("Randevuyu al")
      description: |
        Teklif Accepted, bekleme kaydı Converted olur ve randevu online kurallarıyla oluşur (A1, docs/acik-sorular.md T-86): salon onay veya kapora
        istiyorsa randevu PendingApproval oluşur ve yanıtta depositInstructions bulunur; değilse Confirmed. Müşteriye appointment.confirmed veya
        appointment.requested gider. Kendiliğinden idempotenttir: kabul edilmiş teklif tekrar gelirse aynı randevu 200 ile döner.
        Süre dolmuşsa 409 hold_expired; reddedilmiş veya geri alınmışsa 409 invalid_state_transition; engellenmiş müşteri 403 customer_blocked.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200':
          description: Randevu oluştu
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointment'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503': { $ref: '#/components/responses/TryAgain' }

  /api/v1/public/waitlist-offers/{accessCode}/decline:
    parameters:
      - $ref: '#/components/parameters/AccessCodePath'
    post:
      tags: [public-waitlist]
      operationId: publicDeclineWaitlistOffer
      summary: Teklifi reddet ("Bu saat olmaz")
      description: |
        Teklif Declined olur, saat sıradaki uygun kişiye teklif edilir. Kişi listede kalır (Waiting). Zaten reddedilmişse aynı sonuç 200 ile döner;
        kabul edilmiş veya geri alınmışsa 409 invalid_state_transition; süresi dolmuşsa 409 hold_expired.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Reddedildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWaitlistOffer'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/public/waitlist/{accessCode}/leave:
    parameters:
      - $ref: '#/components/parameters/AccessCodePath'
    post:
      tags: [public-waitlist]
      operationId: publicLeaveWaitlist
      summary: Listeden çık ("Listeden çık")
      description: |
        BeklemeDoldu "Listeden çık". accessCode bekleme kaydının kodudur (PublicWaitlistOffer.waitlistAccessCode, PublicWaitlistEntry.accessCode).
        Kayıt Cancelled olur; bekleyen teklif varsa Declined olur ve saat sıradakine geçer. Kendiliğinden idempotenttir (zaten çıkmışsa 200).
        Kayıt Converted veya Expired ise 409 invalid_state_transition. Kod geçersizse 404 access_code_invalid.
      responses:
        '200':
          description: Listeden çıkıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWaitlistEntry'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── public-review ─────────────────────────────
  /api/v1/public/reviews/{accessCode}:
    parameters:
      - $ref: '#/components/parameters/AccessCodePath'
    get:
      tags: [public-review]
      operationId: publicGetReviewInvite
      summary: Değerlendirme bağlantısı ("Kuaför Elif'te nasıldı?")
      description: |
        review.invite bağlantısı (omvila.com/d/{accessCode}); müşteri uygulamasındaki Degerlendir ekranının web karşılığı. Giriş istemez.
        Değerlendirilmişse alreadyReviewed = true ve review dolu döner. Kod geçersiz veya süresi dolmuşsa 404 access_code_invalid.
      responses:
        '200':
          description: Değerlendirme formu bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReviewInvite'
              example:
                brand: { name: Kuaför Elif, slug: kuafor-elif, logoUrl: null }
                branchName: Kadıköy
                appointmentStartUtc: '2026-11-12T11:00:00Z'
                timeZone: Europe/Istanbul
                serviceNames: [Boya ve fön]
                staff: { name: Elif Kaya, photoUrl: null }
                customerDisplayName: Merve Y.
                alreadyReviewed: false
                review: null
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [public-review]
      operationId: publicCreateReview
      summary: Değerlendirmeyi gönder ("Gönder")
      description: |
        Yalnız Completed randevu ve bir kez değerlendirilir: değerlendirilmişse 409 already_reviewed; randevu Completed değilse 409 invalid_state_transition.
        Değerlendirme yayınlanmış olarak kaydedilir (yorumda ad + soyadın baş harfi görünür); salonun Owner ve BranchManager kullanıcılarına
        staff.review_received gider (personele gitmez, docs/acik-sorular.md T-86). Rezervasyon sayfasındaki puan, yayınlanmış değerlendirme sayısı
        ReviewPublicThreshold'u geçince ve salon gösteriyorsa (showReviews) PublicBrand.rating ile döner.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicReviewCreate'
            example:
              rating: 4
              comment: Boya tam istediğim gibi oldu.
      responses:
        '201':
          description: Değerlendirme kaydedildi; güncel form bilgisi döner (alreadyReviewed = true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReviewInvite'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ───────────────────────────── me-auth (müşteri uygulaması) ─────────────────────────────
  /api/v1/me/auth/otp/request:
    post:
      tags: [me-auth]
      operationId: meRequestOtp
      summary: SMS kodu iste (müşteri uygulaması girişi)
      description: |
        Müşteri uygulaması "Giriş" ekranındaki "Kod gönder". Kod her zaman OMVILA adıyla SMS'tir (otp.code, OtpChallenge.Purpose CustomerLogin).
        Numaranın kayıtlı olup olmadığı yanıtta açık edilmez (her durumda 202). Yeniden gönderim ve deneme sınırları salon girişiyle aynıdır
        (429 otp_resend_too_soon, otp_attempts_exceeded).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeOtpRequest'
            example:
              phone: '0532 611 24 67'
      responses:
        '202':
          description: Kod gönderildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
              example:
                otpId: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f6c01
                expiresInSeconds: 180
                resendAfterSeconds: 60
                phoneMasked: '0532 *** ** 67'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/me/auth/otp/verify:
    post:
      tags: [me-auth]
      operationId: meVerifyOtp
      summary: SMS kodunu doğrula, oturum aç ("GirisKod")
      description: |
        Kod doğruysa müşteri oturumu açılır (CustomerSession). Numaraya ait global Customer kaydı yoksa açılır; kayıt IsVerified ve HasAppAccount olur.
        Bu işlem hiçbir markada BrandCustomer açmaz. Jetonlar gövdede döner (yalnız mobil istemci); uygulama yenileme jetonunu
        flutter_secure_storage'da saklar. rememberDevice alanı bu uçta yok sayılır. Kod hatalıysa 422 otp_invalid (meta.attemptsLeft),
        süresi dolmuşsa 422 otp_expired.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Oturum açıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeAuthResult'
              example:
                accessToken: ornek-erisim-jetonu
                expiresInSeconds: 900
                refreshToken: ornek-yenileme-jetonu
                isNewAccount: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/me/auth/refresh:
    post:
      tags: [me-auth]
      operationId: meRefreshToken
      summary: Erişim jetonunu yenile (müşteri)
      description: |
        Yenileme jetonu gövdede gönderilir ve her kullanımda döndürülür (rotation): yanıttaki yeni refreshToken saklanır, eskisi geçersizdir.
        Kullanılmış bir jeton yeniden gelirse o zincirdeki bütün jetonlar iptal edilir ve 401 unauthorized döner (uygulama girişe döner).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeRefreshRequest'
      responses:
        '200':
          description: Yeni jetonlar (refreshToken her zaman dolu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: ornek-erisim-jetonu
                expiresInSeconds: 900
                refreshToken: ornek-yeni-yenileme-jetonu
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/auth/logout:
    post:
      tags: [me-auth]
      operationId: meLogout
      summary: Oturumu kapat ("Çıkış yap")
      description: |
        Gönderilen yenileme jetonunun zinciri iptal edilir. pushToken gönderilirse o cihaz kaydı pasifleşir (çıkış yapan telefona push gitmez).
        Uygulama jetonları yerelde de siler. İstek kendiliğinden idempotenttir.
      security: [ { meBearer: [] } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeLogoutRequest'
      responses:
        '204': { description: Kapatıldı }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── me-profile ─────────────────────────────
  /api/v1/me/profile:
    get:
      tags: [me-profile]
      operationId: meGetProfile
      summary: Profil ("Profil", "Profil bilgilerim")
      description: |
        Global Customer kaydının müşteriye görünen alanları. Markalar bu kaydın tamamını görmez (ürün kuralı 5). Telefon giriş anahtarıdır, salt okunurdur
        ("Değiştirmek için destek"). fullName, müşteri henüz ad vermediyse (ilk girişte, randevusuz) null'dır; uygulama selamlamayı adsız gösterir ve
        randevu alırken adı ister. Profilde "Salonlarım" meListBrands'ten gelir.
      security: [ { meBearer: [] } ]
      responses:
        '200':
          description: Profil
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfile'
              example:
                id: 0193a1b2-7c4d-7e8f-9a0b-1c2d3e4f6c10
                fullName: Merve Yıldız
                reviewerDisplayName: Merve Y.
                phone: '+905326112467'
                email: merve.yildiz@example.com
                language: tr
                version: 'W/"5120"'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me-profile]
      operationId: meUpdateProfile
      summary: Profil bilgilerini kaydet ("Kaydet")
      description: |
        Gönderilmeyen alan değişmez; email için açıkça null gönderilirse e-posta silinir. Telefon bu uçla değişmez.
        Dil v1'de yalnız tr'dir (uygulama arayüzü ve bildirim metinleri Türkçe; English seçeneği docs/acik-sorular.md T-101'de açık).
        Biçim hatası 400 validation_failed (fullName too_short / too_long, email invalid_format).
      security: [ { meBearer: [] } ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeProfileUpdate'
            example:
              fullName: Merve Yıldız
              email: merve.yildiz@example.com
      responses:
        '200':
          description: Kaydedildi
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }

  /api/v1/me/consents:
    get:
      tags: [me-profile]
      operationId: meListConsents
      summary: İzinlerim (salon bazında kampanya izni)
      description: |
        "İzinlerim (KVKK)" ekranı. Randevu mesajları işlem mesajıdır, rızaya bağlı değildir ve kapatılamaz (ekrandaki açıklama metni; listede satırı yoktur).
        Liste, müşterinin müşteri kaydı (BrandCustomer) olan markalardır; yalnız kaydedilen (randevu alınmamış) salon listede yoktur.
        marketingGranted, o markadaki son Marketing* rıza kaydıdır (ConsentRecord; kayıt yoksa false). İYS'ye bildirim v1'de yapılmaz, rıza yalnız toplanır (T-09).
      security: [ { meBearer: [] } ]
      responses:
        '200':
          description: Kampanya izinleri
          content:
            application/json:
