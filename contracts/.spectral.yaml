extends: ["spectral:oas"]
# Proje kurallarının çoğu scripts/check_conventions.py içindedir (JSONPath ile ifadesi zor olanlar).
rules:
  omvila-operation-id-format:
    description: operationId {surface}{Verb}{Resource} biçiminde olmalı
    given: $.paths[*][get,post,put,patch,delete].operationId
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^(manage|public|me|admin|webhook)[A-Z][A-Za-z]+$"
  omvila-single-tag:
    description: Her işlemin tam bir etiketi olmalı
    given: $.paths[*][get,post,put,patch,delete]
    severity: error
    then:
      field: tags
      function: length
      functionOptions: { min: 1, max: 1 }
  omvila-property-camel:
    description: Alan adları camelCase olmalı
    given: $.components.schemas[*].properties
    severity: error
    then:
      field: "@key"
      function: casing
      functionOptions: { type: camel }
