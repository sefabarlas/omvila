# OMVILA müşteri uygulaması ("Randevularım bir arada"). Kurallar: mobile/musteri/AGENTS.md,
# docs/standartlar/kodlama-flutter.md. Uygulama kimliği com.omvila.app.
name: omvila_musteri
description: OMVILA müşteri uygulaması
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  # Takvime ekle: yerel takvimin "etkinlik ekle" ekranını açar (Android intent, iOS EventKitUI); .ics
  # dosyası paylaşmak ayrıca dosya/paylaşım bağımlılığı ister ve kullanıcıyı takvim seçimine bırakır.
  add_2_calendar: ^3.0.1
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  # Yenileme jetonu ve oturum (kodlama-flutter.md § API).
  flutter_secure_storage: ^11.2.0
  # OMVILA amblemi (packages/design-tokens/assets/logos).
  flutter_svg: ^2.5.0
  go_router: ^18.1.4
  # Lucide ikonları (kodlama-flutter.md § Tema). `lucide_icons` paketi Flutter 3.47 ile derlenmiyor
  # (IconData final sınıf); bakımı süren eşdeğeri.
  lucide_icons_flutter: ^4.0.3
  # "QR kodu okut" (MainBos, KK1): salonun QR kartından bağlantıyı okur; cihazda çalışır, ayrı
  # tarayıcı uygulamasına çıkmaz.
  mobile_scanner: ^7.0.0
  omvila_api:
    path: ../../packages/api-client-dart
  omvila_ui:
    path: ../../packages/omvila_ui
  # SMS kodu otomatik doldurma yalnız Android'de (SMS Retriever; izin istemez). iOS'ta
  # AutofillHints.oneTimeCode yeterli (kodlama-flutter.md § Metin). 2.6 compileSdk 37 istiyor; Flutter
  # 3.47'nin AGP'si 36'ya kadar destekliyor.
  sms_autofill: ">=2.5.0 <2.6.0"
  # Yol tarifi (harita) ve aydınlatma metni bağlantıları.
  url_launcher: ^6.3.0

dev_dependencies:
  alchemist: ^0.12.0
  flutter_test:
    sdk: flutter
  # Uçtan uca akışlar Prism mock'a karşı (docs/standartlar/test-stratejisi.md; integration_test/).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
