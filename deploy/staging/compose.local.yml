# Yerel deneme: staging yığınını *.localhost alt alanlarıyla çalıştırır (Caddy iç CA ile TLS; tarayıcı uyarısı beklenir).
#   docker compose -f deploy/staging/compose.yml -f deploy/staging/compose.local.yml \
#     --env-file deploy/staging/.env.local up --build
# Adresler: https://salon.localhost:8443, https://api.localhost:8443, https://randevu.localhost:8443,
#           https://www.localhost:8443, https://sms.localhost:8443, https://posta.localhost:8443
# Portlar kök docker-compose.yml (5432, 4010, 8025, 1025) ve yerel geliştirme (5173, 3000) ile çakışmaz.
# Caddy içeride de 8443'te dinler: rezervasyon sunucusu (SSR) aynı adresi iç ağdan çağırabilsin.
# .env.local'de URL'ler bu adreslere ayarlanır (deploy/staging/env.example § Yerel deneme).
services:
  caddy:
    environment:
      CADDY_HTTP_PORT: 8080
      CADDY_HTTPS_PORT: 8443
    ports: !override
      - '8080:8080'
      - '8443:8443'

  rezervasyon:
    # SSR'nin Caddy iç CA sertifikasına güvenmesi için (yalnız yerel; staging'de Let's Encrypt).
    # Caddy veri birimi yalnız root'a açık (0700): yerelde root ile okunur. Node sertifikayı açılışta okur,
    # bu yüzden Caddy kökü üretene kadar beklenir.
    user: '0:0'
    environment:
      NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt
    volumes:
      - caddy_data:/caddy-data:ro
    command:
      - sh
      - -c
      - until [ -f "$$NODE_EXTRA_CA_CERTS" ]; do sleep 1; done; exec node web/rezervasyon/server.js
